        body {

        .glassmorphism {

        /* ============================================================================
           ATTRACTIVE CODE HOVER ANIMATIONS & ULTRA-PREMIUM INTERACTIVE STYLES

        /* Glowing Animated Code Chips */
        .code-chip {
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.2rem 0.55rem;
            border-radius: 0.4rem;
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(15, 23, 42, 0.08);
            color: #0284c7;
            border: 1px solid rgba(2, 132, 199, 0.25);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            user-select: all;
        }

        .dark .code-chip {
            background: rgba(15, 23, 42, 0.7);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .code-chip:hover {
            transform: translateY(-2px) scale(1.06);
            box-shadow: 0 4px 16px rgba(56, 189, 248, 0.4);
            border-color: rgba(56, 189, 248, 0.8);
            background: rgba(56, 189, 248, 0.18);
            color: #0284c7;
        }

        .dark .code-chip:hover {
            background: rgba(56, 189, 248, 0.25);
            color: #7dd3fc;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.5);
        }

        .code-chip:active {
            transform: scale(0.96);
        }

        /* Animated Code Block Container with Sheen Shimmer Hover */
        .code-block-wrapper {
            position: relative;
            border-radius: 0.75rem;
            overflow: hidden;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.5);
        }

        .code-block-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(99, 102, 241, 0.18) 50%,
                transparent 55%
            );
            transform: rotate(30deg) translateY(-100%);
            transition: transform 0.8s ease-in-out;
            pointer-events: none;
            z-index: 2;
        }

        .code-block-wrapper:hover::before {
            transform: rotate(30deg) translateY(100%);
        }

        .code-block-wrapper:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.7);
            box-shadow: 0 16px 36px -8px rgba(99, 102, 241, 0.35), 0 0 24px rgba(99, 102, 241, 0.25);
        }

        /* Line hover animations inside code blocks */
        .code-line {
            display: flex;
            padding: 0.2rem 0.75rem;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
            font-family: 'JetBrains Mono', Consolas, monospace;
            border-radius: 0.25rem;
        }

        .code-line:hover {
            background: rgba(99, 102, 241, 0.15) !important;
            border-left: 3px solid #818cf8;
            padding-left: 1rem;
        }

        /* Copy Button Hover */
        .code-copy-btn {
            opacity: 0.85;
            transition: all 0.2s ease;
        }

        .code-block-wrapper:hover .code-copy-btn {
            opacity: 1;
            transform: scale(1.05);
        }

        /* 3D Attractive Card Hover Animations */
        .hover-card-3d {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
        }

        .hover-card-3d:hover {
            transform: translateY(-5px) scale(1.015);
            box-shadow: 0 20px 32px -10px rgba(0, 0, 0, 0.15), 0 10px 18px -5px rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.4);
        }

        /* Shimmer effect utility */
        .hover-shimmer {
            position: relative;
            overflow: hidden;
        }

        .hover-shimmer::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .hover-shimmer:hover::after {
            transform: translateX(100%);
        }
    </style>
</head>

            const [forgotStep, setForgotStep] = React.useState(1);
            const [forgotMethod, setForgotMethod] = React.useState(null); // 'email' or 'mobile'

            const [forgotMobile, setForgotMobile] = React.useState('');
            const [otp, setOtp] = React.useState('');
            const [newPassword, setNewPassword] = React.useState('');
            const [confirmNewPassword, setConfirmNewPassword] = React.useState('');


            const validateIndianMobile = (num) => {
                const regex = /^(?:\+91|0)?[6-9]\d{9}$/;
                return regex.test(num);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (isRegister) {
                    if (!name || !email || !password || !mobile || !securityCode) {
                        triggerToast('Please complete all form fields.', 'error');
                        return;
                    }
                    if (!emailRegex.test(email)) {
                        triggerToast('Invalid email format.', 'error');
                        return;
                    }
                    if (password.length < 6) {
                        triggerToast('Password must be at least 6 characters long.', 'error');
                        return;
                    }
                    if (!validateIndianMobile(mobile)) {
                        triggerToast('Please enter a valid 10-digit Indian mobile number (e.g., 9876543210).', 'error');
                        return;
                    }
                    if (securityCode !== '002') {
                        triggerToast('Invalid authorization code.', 'error');
                        return;
                    }
                    onRegister(name, email, password, mobile, role, dept || 'Construction Dept', securityCode);
                } else {
                    if (!email || !password) {
                        triggerToast('Please provide email and password.', 'error');
                        return;
                    }
                    if (!emailRegex.test(email)) {
                        triggerToast('Invalid email format.', 'error');
                        return;
                    }
                    if (password.length < 6) {
                        triggerToast('Password must be at least 6 characters long.', 'error');
                        return;

                    onLogin(email, password);

            const handleForgotPasswordSubmit = async (e) => {
                e.preventDefault();
                if (forgotStep === 1) {
                    if (forgotMethod === 'email') {
                        if (!forgotEmail) {
                            triggerToast('Please provide your email address.', 'error');
                            return;
                        }
                        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                        if (!emailRegex.test(forgotEmail)) {
                            triggerToast('Invalid email format.', 'error');
                            return;
                        }
                        try {
                            const response = await fetch('/api/auth/forgot-password', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ email: forgotEmail })
                            });

                            if (data.success) {
                                triggerToast('Verification code sent successfully to your email!', 'success');
                                setForgotStep(2);
                            } else {
                                triggerToast(data.msg || 'No account found with this email.', 'error');

                            triggerToast('Please enter a valid 10-digit Indian mobile number (e.g., 9876543210).', 'error');

                                body: JSON.stringify({ mobile: forgotMobile })

                                setForgotStep(2);

                                triggerToast(data.msg || 'No account found with this mobile number.', 'error');
                            }
                        } catch (err) {
                            console.error('Forgot password error:', err);

                        }

                        triggerToast('Please fill in all fields.', 'error');
                        return;
                    }
                    if (newPassword.length < 6) {
                        triggerToast('New password must be at least 6 characters long.', 'error');
                        return;
                    }
                    if (newPassword !== confirmNewPassword) {
                        triggerToast('Passwords do not match.', 'error');
                        return;
                    }
                    try {
                        const payload = forgotMethod === 'email'
                            ? { email: forgotEmail, otp, password: newPassword }
                            : { mobile: forgotMobile, otp, password: newPassword };
                        const response = await fetch('/api/auth/reset-password', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        const data = await response.json();
                        if (data.success) {
                            triggerToast('Password reset successfully. Please log in with your new password.', 'success');

                            const usersList = getStored('users', INITIAL_USERS);

            }, [currentUser]);

            React.useEffect(() => {
                if (!currentUser) return;
                const loadAllData = async () => {
                    try {
                        // Load projects
                        const projRes = await apiFetch('/api/projects');
                        if (projRes.success && projRes.data) {
                            db.projects = projRes.data.map(p => ({
                                id: p._id || p.id,
                                name: p.name,
                                category: p.category,
                                client: p.client,
                                budget: p.budget,
                                actualExpense: p.actualExpense || 0,
                                status: p.status || 'Ongoing',
                                progress: p.progress || 0,
                                location: p.location,
                                startDate: p.startDate ? p.startDate.split('T')[0] : '',
                                endDate: p.endDate ? p.endDate.split('T')[0] : '',
                                projectManager: p.projectManager
                            }));
                        }

                        // Load resources
                        const resRes = await apiFetch('/api/resources');
                        if (resRes.success && resRes.data) {
                            db.resources = resRes.data.map(r => ({
                                id: r._id || r.id,
                                name: r.name,
                                category: r.category,
                                status: r.status,
                                currentProjectId: r.currentProjectId ? (r.currentProjectId._id || r.currentProjectId) : null,
                                lastServiceDate: r.lastServiceDate ? r.lastServiceDate.split('T')[0] : '',
                                nextServiceDate: r.nextServiceDate ? r.nextServiceDate.split('T')[0] : ''
                            }));
                        }

                        // Load inventory
                        const invRes = await apiFetch('/api/inventory');
                        if (invRes.success && invRes.data) {
                            db.inventory = invRes.data.map(i => ({
                                id: i._id || i.id,
                                name: i.name,
                                category: i.category,
                                quantity: i.quantity,
                                unit: i.unit,
                                threshold: i.threshold,
                                costPerUnit: i.costPerUnit
                            }));
                        }

                        // Load procurements
                        const procRes = await apiFetch('/api/procurements');
                        if (procRes.success && procRes.data) {
                            db.procurements = procRes.data.map(p => ({
                                id: p._id || p.id,
                                vendorName: p.vendorName,
                                category: p.category,
                                items: p.items,
                                totalAmount: p.totalAmount,
                                status: p.status,
                                invoiceNo: p.invoiceNo,
                                date: p.date ? p.date.split('T')[0] : ''
                            }));
                        }

                        // Load workers
                        const workerRes = await apiFetch('/api/workers');
                        if (workerRes.success && workerRes.data) {
                            db.workers = workerRes.data.map(w => ({
                                id: w._id || w.id,
                                name: w.name,
                                category: w.category,
                                phone: w.phone,
                                dailyWage: w.dailyWage,
                                status: w.status,
                                currentProjectId: w.currentProjectId ? (w.currentProjectId._id || w.currentProjectId) : null
                            }));
                        }

                        // Load daily logs
                        const logRes = await apiFetch('/api/progress-logs');
                        if (logRes.success && logRes.data) {
                            db.dailyLogs = logRes.data.map(l => ({
                                id: l._id || l.id,
                                projectId: l.projectId ? (l.projectId._id || l.projectId) : '',
                                date: l.date ? l.date.split('T')[0] : '',
                                workCompleted: l.workCompleted,
                                delayTime: l.delayTime || 0,
                                delayReason: l.delayReason || 'None',
                                supervisorId: l.supervisorId ? (l.supervisorId._id || l.supervisorId) : ''
                            }));
                        }

                        // Load milestones & budgets for all projects in parallel
                        if (db.projects && db.projects.length > 0) {
                            const milestonesArr = [];
                            const budgetsArr = [];
                            await Promise.all(db.projects.map(async (p) => {
                                try {
                                    const mRes = await apiFetch(`/api/projects/${p.id}/milestones`);
                                    if (mRes.success && mRes.data) {
                                        mRes.data.forEach(m => {
                                            milestonesArr.push({
                                                id: m._id || m.id,
                                                projectId: m.projectId,
                                                title: m.title,
                                                phase: m.phase,
                                                status: m.status,
                                                dueDate: m.dueDate ? m.dueDate.split('T')[0] : '',
                                                actualCompletionDate: m.actualCompletionDate ? m.actualCompletionDate.split('T')[0] : null
                                            });
                                        });
                                    }
                                } catch (err) {
                                    console.error('Milestones fetch error:', err);
                                }

                                try {
                                    const bRes = await apiFetch(`/api/projects/${p.id}/budgets`);
                                    if (bRes.success && bRes.data) {
                                        bRes.data.forEach(b => {
                                            budgetsArr.push({
                                                id: b._id || b.id,
                                                projectId: b.projectId,
                                                category: b.category,
                                                allocated: b.allocated,
                                                actual: b.actual || 0
                                            });
                                        });
                                    }
                                } catch (err) {
                                    console.error('Budgets fetch error:', err);
                                }
                            }));
                            if (milestonesArr.length > 0) db.milestones = milestonesArr;
                            if (budgetsArr.length > 0) db.budgets = budgetsArr;
                        }

                        // Load attendance
                        const datesToQuery = ['2026-07-07', '2026-07-08', new Date().toISOString().substring(0, 10)];
                        const attendanceArr = [];
                        await Promise.all(datesToQuery.map(async (d) => {
                            try {
                                const aRes = await apiFetch(`/api/attendance?date=${d}`);
                                if (aRes.success && aRes.data) {
                                    attendanceArr.push({
                                        date: d,
                                        presentIds: aRes.data.presentWorkers ? aRes.data.presentWorkers.map(w => w._id || w) : []
                                    });
                                }
                            } catch (err) {
                                console.error('Attendance fetch error:', err);
                            }
                        }));
                        if (attendanceArr.length > 0) db.attendance = attendanceArr;

                        syncDB();
                        setDataLoaded(prev => !prev);
                    } catch (err) {
                        console.error('Failed to load DB from backend APIs:', err);
                    }
                };
                loadAllData();
            }, [currentUser]);

            React.useEffect(() => {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('bt_theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('bt_theme', 'light');
                }
            }, [isDark]);

            const triggerToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            const handleLogin = async (email, password) => {
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email, password }),
                    });
                    const data = await response.json();
                    if (data.success) {
                        const userWithStatus = { ...data.user, status: data.user.status || 'Active' };
                        setCurrentUser(userWithStatus);
                        setStored('logged_in_user', userWithStatus);
                        setStored('token', data.token);
                        setViewRole(data.user.role);
                        setStored('active_view_role', data.user.role);
                        setActiveTab('dashboard');
                        triggerToast(`Session authenticated successfully as ${data.user.name}.`);
                    } else {
                        triggerToast(`Authentication failed: ${data.msg || 'Invalid credentials.'}`, 'error');
                    }
                } catch (err) {
                    console.error('Login error:', err);
                    triggerToast('Network error: Unable to connect to authentication server.', 'error');
                }
            };

            const handleRegister = async (name, email, password, mobile, role, department, securityCode) => {
                try {
                    const response = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ name, email, password, mobile, role, department, securityCode }),
                    });
                    const data = await response.json();
                    if (data.success) {
                        const userWithStatus = { ...data.user, status: data.user.status || 'Active' };
                        // Add registered user locally so local cache knows it
                        const usersList = getStored('users', INITIAL_USERS);
                        const updated = [...usersList, { ...userWithStatus, password, mobile }];
                        setStored('users', updated);

                        setCurrentUser(userWithStatus);
                        setStored('logged_in_user', userWithStatus);
                        setStored('token', data.token);
                        setViewRole(role);
                        setStored('active_view_role', role);
                        setActiveTab('dashboard');
                        triggerToast(`Account onboarding finished: Welcome ${data.user.name}!`, 'success');
                    } else {
                        triggerToast(`Register failed: ${data.msg || 'Error registering account.'}`, 'error');
                    }
                } catch (err) {
                    console.error('Registration error:', err);
                    triggerToast('Network error: Unable to connect to registration server.', 'error');
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                localStorage.removeItem('buildtrack_logged_in_user');
                setViewRole(null);
                localStorage.removeItem('buildtrack_active_view_role');
                triggerToast('Session terminated successfully.', 'info');
            };

            const handleRoleChange = (roleName) => {
                setViewRole(roleName);
                setStored('active_view_role', roleName);
                triggerToast(`Switched active view focus to: ${roleName}`, 'info');
            };

            if (!currentUser) {
                return <LoginView onLogin={handleLogin} onRegister={handleRegister} triggerToast={triggerToast} toast={toast} />;
            }

            if (currentUser.status === 'Pending') {
                return <PendingApprovalView user={currentUser} onLogout={handleLogout} />;
            }

            const isAuthorized = isRoleAuthorized(currentUser.role, viewRole);

            return (
                <div className="flex h-screen overflow-hidden bg-slate-50 dark:bg-slate-900 transition-colors duration-200">
                    {toast && (
                        <div className={`fixed top-4 right-4 z-50 flex items-center px-4 py-3 rounded-lg shadow-xl border transition-all duration-300 text-white ${toast.type === 'success' ? 'bg-emerald-600 border-emerald-500' :
                            toast.type === 'info' ? 'bg-indigo-600 border-indigo-500' :
                                toast.type === 'warning' ? 'bg-amber-600 border-amber-500' :
                                    'bg-rose-600 border-rose-500'
                            }`}>
                            <span className="font-medium">{toast.message}</span>
                        </div>
                    )}
                    <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} viewRole={viewRole} />
                    <div className="flex-1 flex flex-col overflow-hidden">
                        <Header
                            user={currentUser}
                            activeViewRole={viewRole}
                            handleRoleChange={handleRoleChange}
                            isDark={isDark}
                            setIsDark={setIsDark}
                            triggerToast={triggerToast}
                            onLogout={handleLogout}
                            onOpenCodeInspector={() => setIsCodeInspectorOpen(true)}
                        />
                        <main className="flex-1 overflow-y-auto p-6 bg-slate-100 dark:bg-slate-950">
                            {isAuthorized ? (
                                <TabContainer
                                    activeTab={activeTab}
                                    user={currentUser}
                                    viewRole={viewRole}
                                    triggerToast={triggerToast}
                                    setActiveTab={setActiveTab}
                                />
                            ) : (
                                <AccessDeniedView
                                    currentUser={currentUser}
                                    viewRole={viewRole}
                                    onRevert={() => setViewRole(currentUser.role)}
                                    onLogout={handleLogout}
                                />
                            )}
                        </main>
                    </div>
                    <CodeInspectorModal
                        isOpen={isCodeInspectorOpen}
                        onClose={() => setIsCodeInspectorOpen(false)}
                    />
                </div>
            );
        };

        // ============================================================================
        // 3. SIDEBAR NAVIGATION COMPONENT
        // ============================================================================

        const Sidebar = ({ activeTab, setActiveTab, viewRole }) => {
            const theme = getTheme(viewRole);
            const menuItems = [
                { id: 'dashboard', label: 'Overview', icon: 'layout-dashboard', roles: ['Administrator', 'Project Manager', 'Site Engineer', 'Contractor', 'Client'] },
                { id: 'projects', label: 'Projects & Milestones', icon: 'building-2', roles: ['Administrator', 'Project Manager', 'Site Engineer', 'Client'] },
                { id: 'progress', label: 'Progress Logs', icon: 'clipboard-list', roles: ['Administrator', 'Project Manager', 'Site Engineer', 'Contractor'] },
                { id: 'resources', label: 'Machinery & Tools', icon: 'truck', roles: ['Administrator', 'Project Manager', 'Site Engineer'] },
                { id: 'inventory', label: 'Inventory & Materials', icon: 'boxes', roles: ['Administrator', 'Project Manager', 'Contractor'] },
                { id: 'workforce', label: 'Workforce & Shifts', icon: 'users', roles: ['Administrator', 'Project Manager', 'Contractor'] },
                { id: 'procurement', label: 'Procurement & POs', icon: 'shopping-cart', roles: ['Administrator', 'Project Manager'] },
                { id: 'budgets', label: 'Cost & Budgets', icon: 'circle-dollar-sign', roles: ['Administrator', 'Project Manager', 'Client'] },
                { id: 'reports', label: 'Reports Exporter', icon: 'file-text', roles: ['Administrator', 'Project Manager', 'Client'] }
            ];

            const filteredItems = menuItems.filter(item => item.roles.includes(viewRole));

            React.useEffect(() => {
                // Rerender Lucide Icons when active components mount
                lucide.createIcons();
            }, [activeTab, viewRole]);

            return (
                <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col h-full border-r border-slate-800">
                    {/* Header/Logo */}
                    <div className="p-6 flex items-center gap-3 border-b border-slate-800">
                        <div className={`w-10 h-10 rounded-lg bg-gradient-to-tr ${theme.gradientAccent} flex items-center justify-center text-white font-bold shadow-md shadow-slate-950/20`}>
                            <i data-lucide="hard-hat" className="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 className="text-xl font-bold text-white tracking-wide">BuildTrack</h1>
                            <p className={`text-xs ${theme.textAccentMuted || theme.textAccent} font-semibold tracking-wider uppercase`}>Enterprise Operations</p>
                        </div>
                    </div>

                    {/* Navigation Menu Links */}
                    <nav className="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
                        {filteredItems.map(item => (
                            <button
                                key={item.id}
                                onClick={() => setActiveTab(item.id)}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all duration-205 group ${activeTab === item.id
                                    ? theme.sidebarActive
                                    : 'hover:bg-slate-800 hover:text-white'
                                    }`}
                            >
                                <i data-lucide={item.icon} className={`w-5 h-5 flex-shrink-0 ${activeTab === item.id ? theme.sidebarIconActive : 'text-slate-400 ' + theme.sidebarHoverText
                                    }`}></i>
                                <span>{item.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* Footer / App Details */}
                    <div className="p-4 border-t border-slate-800 bg-slate-950/40 text-center">
                        <div className="text-[10px] text-slate-500">BUILDTRACK ENTERPRISE V2.4</div>
                        <div className="text-[10px] text-slate-600">Stable Node Session Configured</div>
                    </div>
                </aside>
            );
        };

        // ============================================================================
        // 4. TOP HEADER / CONTROL NAVBAR COMPONENT
        // ============================================================================

        const Header = ({ user, activeViewRole, handleRoleChange, isDark, setIsDark, triggerToast, onLogout, onOpenCodeInspector }) => {
            const theme = getTheme(activeViewRole);
            const [notifs, setNotifs] = React.useState(db.notifications);
            const [showNotifPanel, setShowNotifPanel] = React.useState(false);

            const unreadCount = notifs.filter(n => !n.read).length;

            const markAllRead = () => {
                const updated = notifs.map(n => ({ ...n, read: true }));
                setNotifs(updated);
                db.notifications = updated;
                syncDB();
                triggerToast('All alerts marked as read.');
            };

            React.useEffect(() => {
                lucide.createIcons();
            }, [showNotifPanel, activeViewRole]);

            return (
                <header className="h-16 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex items-center justify-between px-6 z-10 shadow-sm transition-colors duration-200 font-Outfit">
                    <div className="flex items-center gap-4">
                        <span className="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Active Workspace:</span>
                        <div className="relative">
                            {user.role === 'Administrator' ? (
                                <select
                                    value={activeViewRole}
                                    onChange={(e) => handleRoleChange(e.target.value)}
                                    className={`bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white px-3 py-1.5 rounded-lg text-sm font-bold focus:outline-none focus:ring-2 ${theme.focusRing} cursor-pointer`}
                                >
                                    {Object.keys(INITIAL_ROLES).map(role => (
                                        <option key={role} value={role}>{role} View</option>
                                    ))}
                                </select>
                            ) : (
                                <span className={`bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-3 py-1.5 rounded-lg text-sm font-extrabold shadow-sm border border-slate-200 dark:border-slate-700`}>
                                    {activeViewRole}
                                </span>
                            )}
                        </div>
                    </div>

                    <div className="flex items-center gap-3">
                        {/* Developer Code Inspector Button with Animated Hover Glow */}
                        <button
                            onClick={onOpenCodeInspector}
                            className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-gradient-to-r from-indigo-500/10 via-purple-500/10 to-pink-500/10 hover:from-indigo-500/20 hover:via-purple-500/20 hover:to-pink-500/20 text-indigo-600 dark:text-indigo-300 border border-indigo-500/30 text-xs font-bold transition-all duration-300 hover:scale-105 hover:shadow-lg hover:shadow-indigo-500/25 hover:border-indigo-400 cursor-pointer group"
                            title="Inspect Live Code, Schemas & API Endpoints"
                        >
                            <i data-lucide="code" className="w-4 h-4 text-indigo-400 group-hover:rotate-12 transition-transform duration-300"></i>
                            <span className="hidden sm:inline font-mono">System Code</span>
                            <span className="text-[10px] bg-indigo-500/20 text-indigo-300 px-1.5 py-0.2 rounded font-mono group-hover:bg-indigo-500/40">API</span>
                        </button>

                        {/* Light/Dark Toggle */}
                        <button
                            onClick={() => setIsDark(!isDark)}
                            className="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors cursor-pointer"
                            title="Toggle Light/Dark Theme"
                        >
                            <i data-lucide={isDark ? "sun" : "moon"} className="w-5 h-5"></i>
                        </button>

                        {/* Notification Bell */}
                        <div className="relative">
                            <button
                                onClick={() => setShowNotifPanel(!showNotifPanel)}
                                className="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full relative transition-colors cursor-pointer"
                            >
                                <i data-lucide="bell" className="w-5 h-5"></i>
                                {unreadCount > 0 && (
                                    <span className="absolute top-1 right-1 w-2.5 h-2.5 bg-rose-600 border-2 border-white dark:border-slate-900 rounded-full"></span>
                                )}
                            </button>

                            {/* Dropdown Notification Panel */}
                            {showNotifPanel && (
                                <div className="absolute right-0 mt-3 w-80 bg-white dark:bg-slate-850 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 py-2 z-50">
                                    <div className="px-4 py-2 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                                        <span className="font-bold text-sm">System Alerts</span>
                                        {unreadCount > 0 && (
                                            <button onClick={markAllRead} className={`text-xs ${theme.textAccent} font-semibold hover:underline cursor-pointer`}>
                                                Mark all read
                                            </button>
                                        )}
                                    </div>
                                    <div className="max-h-64 overflow-y-auto">
                                        {notifs.length === 0 ? (
                                            <div className="p-4 text-center text-slate-400 text-xs">No alerts active</div>
                                        ) : (
                                            notifs.map(n => (
                                                <div key={n.id} className={`px-4 py-3 border-b border-slate-100 dark:border-slate-700/50 flex items-start gap-2.5 transition-colors ${!n.read ? theme.accentLight : ''}`}>
                                                    <span className={`w-2.5 h-2.5 rounded-full mt-1.5 flex-shrink-0 ${n.type === 'Warning' ? 'bg-amber-500' :
                                                        n.type === 'Alert' ? 'bg-rose-500' :
                                                            n.type === 'Success' ? 'bg-emerald-500' : 'bg-blue-500'
                                                        }`}></span>
                                                    <div>
                                                        <p className="text-xs font-medium text-slate-700 dark:text-slate-200">{n.text}</p>
                                                        <span className="text-[10px] text-slate-400">{n.date}</span>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Profile Area */}
                        <div className="flex items-center gap-3 pl-4 border-l border-slate-200 dark:border-slate-800">
                            <img
                                src={user.avatar}
                                alt={user.name}
                                className={`w-9 h-9 rounded-full object-cover border-2 ${theme.avatarBorder}`}
                            />
                            <div className="hidden md:block text-left">
                                <p className="text-sm font-semibold text-slate-800 dark:text-white leading-tight">{user.name}</p>
                                <span className={`text-xs ${theme.textAccent} font-medium`}>{user.role}</span>
                            </div>
                            <button
                                onClick={onLogout}
                                className="ml-2 p-1.5 hover:bg-rose-100 hover:text-rose-600 dark:hover:bg-rose-955/40 rounded-lg text-slate-400 transition-colors cursor-pointer"
                                title="Sign Out"
                            >
                                <i data-lucide="log-out" className="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </header>
            );
        };

        // ============================================================================
        // 5. MODULE TAB NAVIGATION HANDLER
        // ============================================================================

        const TabContainer = ({ activeTab, user, viewRole, triggerToast, setActiveTab }) => {
            switch (activeTab) {
                case 'dashboard':
                    return <DashboardView user={user} viewRole={viewRole} triggerToast={triggerToast} setActiveTab={setActiveTab} />;
                case 'projects':
                    return <ProjectsView user={user} viewRole={viewRole} triggerToast={triggerToast} />;
                case 'progress':
                    return <ProgressLogsView user={user} viewRole={viewRole} triggerToast={triggerToast} />;
                case 'resources':
                    return <ResourcesView user={user} viewRole={viewRole} triggerToast={triggerToast} />;
                case 'inventory':
                    return <InventoryView user={user} viewRole={viewRole} triggerToast={triggerToast} />;
                case 'workforce':
                    return <WorkforceView user={user} viewRole={viewRole} triggerToast={triggerToast} />;
                case 'procurement':
                    return <ProcurementView user={user} viewRole={viewRole} triggerToast={triggerToast} />;
                case 'budgets':
                    return <BudgetsView user={user} viewRole={viewRole} triggerToast={triggerToast} />;
                case 'reports':
                    return <ReportsView user={user} viewRole={viewRole} triggerToast={triggerToast} />;
                default:
                    return <DashboardView user={user} viewRole={viewRole} triggerToast={triggerToast} setActiveTab={setActiveTab} />;
            }
        };

        // ============================================================================
        // 6. DASHBOARD / OVERVIEW TAB (MODULE 9 & 11)
        // ============================================================================

        const DashboardView = ({ user, viewRole, triggerToast, setActiveTab }) => {
            const theme = getTheme(viewRole);
            const projects = db.projects;
            const resources = db.resources;
            const inventory = db.inventory;
            const workers = db.workers;

            // Clean view initialization

            const [pendingUsers, setPendingUsers] = React.useState([]);

            const fetchPendingUsers = async () => {
                try {
                    const data = await apiFetch('/api/users');
                    if (data && data.success && data.data) {
                        const pending = data.data.filter(u => u.status === 'Pending');
                        let filtered = [];
                        if (user.role === 'Administrator') {
                            filtered = pending;
                        } else if (user.role === 'Project Manager') {
                            filtered = pending.filter(u => u.role === 'Site Engineer' || u.role === 'Contractor' || u.role === 'Worker' || u.role === 'Client');
                        } else if (user.role === 'Site Engineer') {
                            filtered = pending.filter(u => u.role === 'Contractor' || u.role === 'Worker');
                        } else if (user.role === 'Contractor') {
                            filtered = pending.filter(u => u.role === 'Worker');
                        } else {
                            filtered = pending;
                        }
                        setPendingUsers(filtered);
                    }
                } catch (err) {
                    console.error('Error fetching users:', err);
                }
            };

            React.useEffect(() => {
                fetchPendingUsers();
            }, []);

            const handleApproveUser = async (userId, userName) => {
                try {
                    const data = await apiFetch(`/api/users/${userId}/approve`, {
                        method: 'PUT'
                    });
                    if (data && data.success) {
                        // Add system alert about registration approval
                        const newAlert = {
                            id: `n-${Date.now()}`,
                            type: 'Success',
                            text: `User ${userName} request has been approved and activated.`,
                            read: false,
                            date: 'Just now'
                        };
                        db.notifications = [newAlert, ...db.notifications];
                        setStored('notifications', db.notifications);

                        setPendingUsers(pendingUsers.filter(u => u.id !== userId));
                        triggerToast(`Approved registration for user "${userName}".`);
                    } else {
                        triggerToast(`Approval failed: ${data?.msg || 'Error'}`, 'error');
                    }
                } catch (err) {
                    console.error('Approval error:', err);
                    triggerToast('Network error: Unable to approve user.', 'error');
                }
            };

            const handleDeclineUser = async (userId, userName) => {
                try {
                    const data = await apiFetch(`/api/users/${userId}/decline`, {
                        method: 'PUT'
                    });
                    if (data && data.success) {
                        setPendingUsers(pendingUsers.filter(u => u.id !== userId));
                        triggerToast(`Declined registration for user "${userName}".`, 'warning');
                    } else {
                        triggerToast(`Decline failed: ${data?.msg || 'Error'}`, 'error');
                    }
                } catch (err) {
                    console.error('Decline error:', err);
                    triggerToast('Network error: Unable to decline user.', 'error');
                }
            };

            // Math computations
            const activeProjectsCount = projects.filter(p => p.status === 'Ongoing' || p.status === 'Delayed').length;
            const resourceUtilization = Math.round((resources.filter(r => r.status === 'Allocated').length / resources.length) * 100);
            const totalProjectBudget = projects.reduce((acc, curr) => acc + curr.budget, 0);
            const totalActualExpense = projects.reduce((acc, curr) => acc + curr.actualExpense, 0);
            const budgetPercent = Math.round((totalActualExpense / totalProjectBudget) * 100);

            // Recharts Data structures
            const progressChartData = projects.map(p => ({
                name: p.name.split(' ').slice(0, 2).join(' '),
                Progress: p.progress,
                BudgetPercent: Math.round((p.actualExpense / p.budget) * 100)
            }));

            const budgetVsActualData = projects.map(p => ({
                name: p.name.split(' ').slice(0, 2).join(' '),
                Allocated: p.budget / 1000,
                Expended: p.actualExpense / 1000
            }));

            React.useEffect(() => {
                lucide.createIcons();
            }, [pendingUsers]);

            return (
                <div className="space-y-6">
                    {/* Supervisor Approvals Panel */}
                    {pendingUsers.length > 0 && (
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4 font-Outfit">
                            <h3 className={`text-base font-bold flex items-center gap-2 ${theme.textAccent}`}>
                                <i data-lucide="shield-alert" className="w-5 h-5"></i>
                                Pending Registration Authorization Requests
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {pendingUsers.map(pUser => (
                                    <div key={pUser.id} className="p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/40 flex justify-between items-center">
                                        <div>
                                            <div className="flex items-center gap-2">
                                                <span className="font-bold text-sm text-slate-850 dark:text-white">{pUser.name}</span>
                                                <span className={`text-[10px] font-extrabold px-1.5 py-0.5 rounded ${theme.badgeBg}`}>
                                                    {pUser.role}
                                                </span>
                                            </div>
                                            <p className="text-xs text-slate-500 mt-1">Email: {pUser.email}</p>
                                            <p className="text-xs text-slate-400">Dept: {pUser.department}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => handleApproveUser(pUser.id, pUser.name)}
                                                className={`text-white font-bold px-3 py-1.5 rounded-lg text-xs bg-emerald-600 hover:bg-emerald-700`}
                                            >
                                                Approve
                                            </button>
                                            <button
                                                onClick={() => handleDeclineUser(pUser.id, pUser.name)}
                                                className="bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-350 font-bold px-3 py-1.5 rounded-lg text-xs"
                                            >
                                                Decline
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    {/* Header Banner */}
                    <div className="bg-gradient-to-r from-slate-900 to-slate-800 dark:from-slate-950 dark:to-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl flex items-center justify-between">
                        <div>
                            <h2 className="text-2xl font-bold text-white">Welcome back, {user.name}!</h2>
                            <p className="text-slate-400 mt-1">Here is a unified monitoring snapshot for all construction operations.</p>
                            {/* Flirty lines removed */}
                        </div>
                        <span className={`px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 ${theme.badgeBg}`}>
                            <i data-lucide="shield-check" className="w-5 h-5"></i>
                            Session Role: {user.role}
                        </span>
                    </div>

                    {/* Stats Widget Row */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <StatCard icon="building-2" title="Active Projects" value={activeProjectsCount} subtitle="Continuous construction" color={theme.accentName} />
                        <StatCard icon="circle-dollar-sign" title="Total Budget Used" value={`${budgetPercent}%`} subtitle={`$${(totalActualExpense / 1e6).toFixed(2)}M of ${(totalProjectBudget / 1e6).toFixed(2)}M`} color="emerald" />
                        <StatCard icon="truck" title="Heavy Equipment Active" value={`${resourceUtilization}%`} subtitle="Heavy units active" color="indigo" />
                        <StatCard icon="users" title="Labor Strengths" value={workers.length} subtitle="Assigned staff on sites" color="sky" />
                    </div>

                    {/* Charts & Visualization Section */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">

                        {/* Chart 1: Project Progress and Budgets */}
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-base font-bold">Project Progress vs Expense Ratios</h3>
                                <span className="text-xs bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded text-slate-500">Real-time tracker</span>
                            </div>
                            <div className="h-72">
                                <Recharts.ResponsiveContainer width="100%" height="100%">
                                    <Recharts.BarChart data={progressChartData}>
                                        <Recharts.CartesianGrid strokeDasharray="3 3" stroke="#334155" opacity={0.1} />
                                        <Recharts.XAxis dataKey="name" stroke="#64748b" fontSize={11} />
                                        <Recharts.YAxis stroke="#64748b" fontSize={11} />
                                        <Recharts.Tooltip contentStyle={{ background: '#1e293b', border: 'none', borderRadius: '8px', color: '#fff' }} />
                                        <Recharts.Legend />
                                        <Recharts.Bar dataKey="Progress" fill={theme.chartFill} radius={[4, 4, 0, 0]} name="Progress Completion %" />
                                        <Recharts.Bar dataKey="BudgetPercent" fill="#10b981" radius={[4, 4, 0, 0]} name="Budget Expended %" />
                                    </Recharts.BarChart>
                                </Recharts.ResponsiveContainer>
                            </div>
                        </div>

                        {/* Chart 2: Cost Structure */}
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-base font-bold">Financial Commitments ($ Thousands)</h3>
                                <span className="text-xs bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded text-slate-500">Allocated vs Spent</span>
                            </div>
                            <div className="h-72">
                                <Recharts.ResponsiveContainer width="100%" height="100%">
                                    <Recharts.AreaChart data={budgetVsActualData}>
                                        <Recharts.CartesianGrid strokeDasharray="3 3" stroke="#334155" opacity={0.1} />
                                        <Recharts.XAxis dataKey="name" stroke="#64748b" fontSize={11} />
                                        <Recharts.YAxis stroke="#64748b" fontSize={11} />
                                        <Recharts.Tooltip contentStyle={{ background: '#1e293b', border: 'none', borderRadius: '8px', color: '#fff' }} />
                                        <Recharts.Legend />
                                        <Recharts.Area type="monotone" dataKey="Allocated" stroke={theme.chartFill} fillOpacity={0.15} fill="url(#colorAllocated)" name="Budget ($k)" />
                                        <Recharts.Area type="monotone" dataKey="Expended" stroke="#ec4899" fillOpacity={0.15} fill="url(#colorSpent)" name="Expended ($k)" />
                                        <defs>
                                            <linearGradient id="colorAllocated" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="5%" stopColor={theme.chartFill} stopOpacity={0.4} />
                                                <stop offset="95%" stopColor={theme.chartFill} stopOpacity={0} />
                                            </linearGradient>
                                            <linearGradient id="colorSpent" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="5%" stopColor="#ec4899" stopOpacity={0.4} />
                                                <stop offset="95%" stopColor="#ec4899" stopOpacity={0} />
                                            </linearGradient>
                                        </defs>
                                    </Recharts.AreaChart>
                                </Recharts.ResponsiveContainer>
                            </div>
                        </div>

                    </div>

                    {/* Lower Widgets: Alerts, Inventory Warning & Quick Jumps */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

                        {/* Alerts Widget */}
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm lg:col-span-2">
                            <h3 className="text-base font-bold mb-4 flex items-center gap-2">
                                <i data-lucide="alert-triangle" className={`w-5 h-5 ${theme.textAccent}`}></i>
                                Critical Operational Incidents
                            </h3>
                            <div className="space-y-3">
                                {db.notifications.map(n => (
                                    <div key={n.id} className="flex justify-between items-center p-3 rounded-lg bg-slate-50 dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800">
                                        <div className="flex items-center gap-3">
                                            <span className={`w-2.5 h-2.5 rounded-full flex-shrink-0 ${n.type === 'Alert' ? 'bg-rose-500' :
                                                n.type === 'Warning' ? 'bg-amber-500' : 'bg-indigo-500'
                                                }`}></span>
                                            <p className="text-sm font-medium text-slate-700 dark:text-slate-300">{n.text}</p>
                                        </div>
                                        <span className="text-xs text-slate-400 whitespace-nowrap">{n.date}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Material Inventory Warning Widget */}
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                            <h3 className="text-base font-bold mb-4 flex items-center gap-2">
                                <i data-lucide="boxes" className={`w-5 h-5 ${theme.textAccent}`}></i>
                                Critical Stock Limits
                            </h3>
                            <div className="space-y-4">
                                {inventory.map(item => {
                                    const percent = Math.round((item.quantity / item.threshold) * 100);
                                    const isLow = item.quantity <= item.threshold;
                                    return (
                                        <div key={item.id} className="space-y-1">
                                            <div className="flex justify-between text-xs">
                                                <span className="font-semibold text-slate-700 dark:text-slate-300">{item.name}</span>
                                                <span className={isLow ? 'text-rose-500 font-bold' : 'text-slate-500'}>
                                                    {item.quantity} {item.unit} (Limit: {item.threshold})
                                                </span>
                                            </div>
                                            <div className="w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
                                                <div
                                                    className={`h-full rounded-full transition-all duration-500 ${isLow ? 'bg-rose-500' : theme.bgAccent}`}
                                                    style={{ width: `${Math.min(percent, 100)}%` }}
                                                ></div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const StatCard = ({ icon, title, value, subtitle, color }) => {
            const colors = {
                amber: 'bg-amber-500/10 text-amber-500 border border-amber-500/20 hover:border-amber-500/60 hover:shadow-amber-500/20',
                emerald: 'bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 hover:border-emerald-500/60 hover:shadow-emerald-500/20',
                indigo: 'bg-indigo-500/10 text-indigo-500 border border-indigo-500/20 hover:border-indigo-500/60 hover:shadow-indigo-500/20',
                sky: 'bg-sky-500/10 text-sky-500 border border-sky-500/20 hover:border-sky-500/60 hover:shadow-sky-500/20',
                violet: 'bg-violet-500/10 text-violet-500 border border-violet-500/20 hover:border-violet-500/60 hover:shadow-violet-500/20',
                blue: 'bg-blue-500/10 text-blue-500 border border-blue-500/20 hover:border-blue-500/60 hover:shadow-blue-500/20',
                rose: 'bg-rose-500/10 text-rose-500 border border-rose-500/20 hover:border-rose-500/60 hover:shadow-rose-500/20',
                yellow: 'bg-yellow-500/10 text-yellow-500 border border-yellow-500/20 hover:border-yellow-500/60 hover:shadow-yellow-500/20'
            };

            return (
                <div className={`p-6 rounded-2xl border bg-white dark:bg-slate-900 shadow-sm hover-card-3d hover-shimmer group cursor-pointer ${colors[color] || colors['amber']}`}>
                    <div className="flex items-center justify-between mb-4">
                        <span className="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">{title}</span>
                        <div className="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 group-hover:scale-110 group-hover:rotate-6 transition-transform duration-300">
                            <i data-lucide={icon} className="w-6 h-6"></i>
                        </div>
                    </div>
                    <div className="text-3xl font-extrabold tracking-tight mb-1 text-slate-800 dark:text-white group-hover:translate-x-1 transition-transform">{value}</div>
                    <span className="text-xs text-slate-500 dark:text-slate-400 font-medium">{subtitle}</span>
                </div>
            );
        };

        // ============================================================================
        // 7. PROJECTS & MILESTONES TAB (MODULE 2)
        // ============================================================================

        const ProjectsView = ({ user, viewRole, triggerToast }) => {
            const theme = getTheme(viewRole);
            const [projs, setProjs] = React.useState(db.projects);
            const [milestones, setMilestones] = React.useState(db.milestones);
            const [showAddForm, setShowAddForm] = React.useState(false);
            const [selectedProj, setSelectedProj] = React.useState(null);

            // Form state variables (Create / Edit)
            const [name, setName] = React.useState('');
            const [category, setCategory] = React.useState('Commercial');
            const [client, setClient] = React.useState('');
            const [budget, setBudget] = React.useState('');
            const [location, setLocation] = React.useState('');
            const [startDate, setStartDate] = React.useState('');
            const [endDate, setEndDate] = React.useState('');
            const [progress, setProgress] = React.useState(0);
            const [actualExpense, setActualExpense] = React.useState(0);
            const [status, setStatus] = React.useState('Ongoing');

            // Edit/Delete mode state variables
            const [isEditing, setIsEditing] = React.useState(false);
            const [editingProjId, setEditingProjId] = React.useState('');
            const [showDeleteConfirm, setShowDeleteConfirm] = React.useState(false);
            const [deletingProjId, setDeletingProjId] = React.useState('');

            const handleSaveProject = async (e) => {
                e.preventDefault();
                if (!name || !client || !budget || !startDate || !endDate) {
                    triggerToast('Please complete all form fields.', 'error');
                    return;
                }

                const payload = {
                    name,
                    category,
                    client,
                    budget: parseFloat(budget),
                    location,
                    startDate,
                    endDate,
                    ...(isEditing ? {
                        actualExpense: parseFloat(actualExpense),
                        progress: parseInt(progress),
                        status
                    } : {})
                };

                try {
                    let resData;
                    if (isEditing) {
                        resData = await apiFetch(`/api/projects/${editingProjId}`, {
                            method: 'PUT',
                            body: JSON.stringify(payload)
                        });
                    } else {
                        resData = await apiFetch('/api/projects', {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        });
                    }
                    if (resData.success) {
                        const savedProj = resData.data;
                        const newProject = {
                            id: savedProj._id || savedProj.id,
                            name: savedProj.name,
                            category: savedProj.category,
                            client: savedProj.client,
                            budget: savedProj.budget,
                            actualExpense: savedProj.actualExpense || 0,
                            status: savedProj.status || 'Ongoing',
                            progress: savedProj.progress || 0,
                            location: savedProj.location,
                            startDate: savedProj.startDate ? savedProj.startDate.split('T')[0] : startDate,
                            endDate: savedProj.endDate ? savedProj.endDate.split('T')[0] : endDate,
                            projectManager: savedProj.projectManager
                        };

                        let updated;
                        if (isEditing) {
                            updated = projs.map(p => p.id === editingProjId ? newProject : p);
                            triggerToast(`Project "${name}" updated successfully.`);
                        } else {
                            updated = [...projs, newProject];
                            triggerToast(`Project "${name}" initialized successfully.`);

                            // Add default milestones for new project
                            const defaultMilestones = [
                                { id: `m-${Date.now()}-1`, projectId: newProject.id, title: 'Geotechnical Excavation', phase: 'Foundation', status: 'Pending', dueDate: startDate, actualCompletionDate: null },
                                { id: `m-${Date.now()}-2`, projectId: newProject.id, title: 'Structural Columns Casting', phase: 'Structural Work', status: 'Pending', dueDate: endDate, actualCompletionDate: null }
                            ];
                            const updatedMilestones = [...milestones, ...defaultMilestones];
                            setMilestones(updatedMilestones);
                            db.milestones = updatedMilestones;
                        }

                        setProjs(updated);
                        db.projects = updated;
                        syncDB();

                        // Reset forms & states
                        setShowAddForm(false);
                        setIsEditing(false);
                        setEditingProjId('');
                        setName('');
                        setClient('');
                        setBudget('');
                        setLocation('');
                        setStartDate('');
                        setEndDate('');
                        setProgress(0);
                        setActualExpense(0);
                        setStatus('Ongoing');
                    } else {
                        triggerToast(resData.error || resData.msg || 'Failed to save project.', 'error');
                    }
                } catch (err) {
                    console.error('Failed to save project:', err);
                    triggerToast('Network error: Unable to save project.', 'error');
                }
            };

            const handleStartEdit = (proj) => {
                setName(proj.name);
                setCategory(proj.category);
                setClient(proj.client);
                setBudget(proj.budget);
                setLocation(proj.location || '');
                setStartDate(proj.startDate);
                setEndDate(proj.endDate);
                setProgress(proj.progress || 0);
                setActualExpense(proj.actualExpense || 0);
                setStatus(proj.status || 'Ongoing');
                setEditingProjId(proj.id);
                setIsEditing(true);
                setShowAddForm(true);
                setSelectedProj(null);
            };

            const handleStartDelete = (id) => {
                setDeletingProjId(id);
                setShowDeleteConfirm(true);
            };

            const handleDeleteProject = async () => {
                try {
                    const resData = await apiFetch(`/api/projects/${deletingProjId}`, {
                        method: 'DELETE'
                    });
                    if (resData.success) {
                        const updated = projs.filter(p => p.id !== deletingProjId);
                        setProjs(updated);
                        db.projects = updated;
                        syncDB();
                        triggerToast('Project deleted successfully.', 'warning');
                    } else {
                        triggerToast(resData.msg || 'Failed to delete project.', 'error');
                    }
                } catch (err) {
                    console.error('Delete error:', err);
                    triggerToast('Network error: Unable to delete project.', 'error');
                }
                setShowDeleteConfirm(false);
                setDeletingProjId('');
            };

            const toggleMilestoneStatus = async (mileId) => {
                const target = milestones.find(m => m.id === mileId);
                if (!target) return;

                const newStatus = target.status === 'Completed' ? 'Pending' : target.status === 'In Progress' ? 'Completed' : 'In Progress';
                const compDate = newStatus === 'Completed' ? new Date().toISOString().substring(0, 10) : null;

                try {
                    const resData = await apiFetch(`/api/milestones/${mileId}`, {
                        method: 'PUT',
                        body: JSON.stringify({ status: newStatus, actualCompletionDate: compDate })
                    });

                    if (resData.success) {
                        const updated = milestones.map(m => {
                            if (m.id === mileId) {
                                return { ...m, status: newStatus, actualCompletionDate: compDate };
                            }
                            return m;
                        });
                        setMilestones(updated);
                        db.milestones = updated;

                        // Dynamically update overall project progress percentage based on completed milestones
                        if (selectedProj) {
                            const projMilestones = updated.filter(m => m.projectId === selectedProj.id);
                            if (projMilestones.length > 0) {
                                const completedCount = projMilestones.filter(m => m.status === 'Completed').length;
                                const progressPercent = Math.round((completedCount / projMilestones.length) * 100);

                                // Update overall project progress in backend
                                await apiFetch(`/api/projects/${selectedProj.id}`, {
                                    method: 'PUT',
                                    body: JSON.stringify({ progress: progressPercent, status: progressPercent === 100 ? 'Completed' : selectedProj.status })
                                });

                                db.projects = db.projects.map(p => {
                                    if (p.id === selectedProj.id) {
                                        const newP = { ...p, progress: progressPercent, status: progressPercent === 100 ? 'Completed' : p.status };
                                        setSelectedProj(newP);
                                        return newP;
                                    }
                                    return p;
                                });
                                setProjs(db.projects);
                            }
                        }
                        syncDB();
                        triggerToast('Milestone structural status updated.');
                    }
                } catch (err) {
                    console.error('Milestone toggle error:', err);
                    triggerToast('Failed to update milestone status.', 'error');
                }
            };

            const getStatusColor = (status) => {
                switch (status) {
                    case 'Completed': return 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-400';
                    case 'Ongoing': return 'bg-sky-100 text-sky-800 dark:bg-sky-900/30 dark:text-sky-400';
                    case 'Delayed': return 'bg-rose-100 text-rose-800 dark:bg-rose-900/30 dark:text-rose-400';
                    default: return 'bg-slate-100 text-slate-800 dark:bg-slate-850 dark:text-slate-400';
                }
            };

            React.useEffect(() => {
                lucide.createIcons();
            }, [showAddForm, selectedProj, showDeleteConfirm, isEditing]);

            return (
                <div className="space-y-6">
                    {/* Toolbar Header */}
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-xl font-bold">Project Management Hub</h2>
                            <p className="text-sm text-slate-500">Track and schedule overall construction scopes</p>
                        </div>
                        {user.role === 'Project Manager' || user.role === 'Administrator' ? (
                            <button
                                onClick={() => {
                                    if (showAddForm) {
                                        setShowAddForm(false);
                                        setIsEditing(false);
                                        setEditingProjId('');
                                        setName('');
                                        setClient('');
                                        setBudget('');
                                        setLocation('');
                                        setStartDate('');
                                        setEndDate('');
                                    } else {
                                        setShowAddForm(true);
                                        setSelectedProj(null);
