                { id: 'procurement', label: 'Procurement & POs', icon: 'shopping-cart', roles: ['Administrator', 'Project Manager'] },
                { id: 'budgets', label: 'Cost & Budgets', icon: 'circle-dollar-sign', roles: ['Administrator', 'Project Manager', 'Client'] },
                { id: 'reports', label: 'Reports Exporter', icon: 'file-text', roles: ['Administrator', 'Project Manager', 'Client'] }
            ];

            const filteredItems = menuItems.filter(item => item.roles.includes(viewRole));

            React.useEffect(() => {
                // Rerender Lucide Icons when active components mount
                lucide.createIcons();
            }, [activeTab, viewRole]);

            return (
                <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col h-full border-r border-slate-800">
                    {/* Header/Logo */}
                    <div className="p-6 flex items-center gap-3 border-b border-slate-800">
                        <div className={`w-10 h-10 rounded-lg bg-gradient-to-tr ${theme.gradientAccent} flex items-center justify-center text-white font-bold shadow-md shadow-slate-950/20`}>
                            <i data-lucide="hard-hat" className="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 className="text-xl font-bold text-white tracking-wide">BuildTrack</h1>
                            <p className={`text-xs ${theme.textAccentMuted || theme.textAccent} font-semibold tracking-wider uppercase`}>Enterprise Operations</p>
                        </div>
                    </div>

                    {/* Navigation Menu Links */}
                    <nav className="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
                        {filteredItems.map(item => (
                            <button
                                key={item.id}
                                onClick={() => setActiveTab(item.id)}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all duration-205 group ${
                                    activeTab === item.id 
                                        ? theme.sidebarActive 
                                        : 'hover:bg-slate-800 hover:text-white'
                                }`}
                            >
                                <i data-lucide={item.icon} className={`w-5 h-5 flex-shrink-0 ${
                                    activeTab === item.id ? theme.sidebarIconActive : 'text-slate-400 ' + theme.sidebarHoverText
                                }`}></i>
                                <span>{item.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* Footer / App Details */}
                    <div className="p-4 border-t border-slate-800 bg-slate-950/40 text-center">
                        <div className="text-[10px] text-slate-500">BUILDTRACK ENTERPRISE V2.4</div>
                        <div className="text-[10px] text-slate-600">Stable Node Session Configured</div>
                    </div>
                </aside>
            );
        };

        // ============================================================================
        // 4. TOP HEADER / CONTROL NAVBAR COMPONENT
        // ============================================================================
        
        const Header = ({ user, activeViewRole, handleRoleChange, isDark, setIsDark, triggerToast, onLogout }) => {
            const theme = getTheme(activeViewRole);
            const [notifs, setNotifs] = React.useState(db.notifications);
            const [showNotifPanel, setShowNotifPanel] = React.useState(false);

            const unreadCount = notifs.filter(n => !n.read).length;

            const markAllRead = () => {
                const updated = notifs.map(n => ({ ...n, read: true }));
                setNotifs(updated);
                db.notifications = updated;
                syncDB();
                triggerToast('All alerts marked as read.');
            };

            React.useEffect(() => {
                lucide.createIcons();
            }, [showNotifPanel, activeViewRole]);

            return (
                <header className="h-16 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex items-center justify-between px-6 z-10 shadow-sm transition-colors duration-200 font-Outfit">
                    <div className="flex items-center gap-4">
                        <span className="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Active Workspace:</span>
                        <div className="relative">
                            {user.role === 'Administrator' ? (
                                <select 
                                    value={activeViewRole} 
                                    onChange={(e) => handleRoleChange(e.target.value)}
                                    className={`bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white px-3 py-1.5 rounded-lg text-sm font-bold focus:outline-none focus:ring-2 ${theme.focusRing} cursor-pointer`}
                                >
                                    {Object.keys(INITIAL_ROLES).map(role => (
                                        <option key={role} value={role}>{role} View</option>
                                    ))}
                                </select>
                            ) : (
                                <span className={`bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-3 py-1.5 rounded-lg text-sm font-extrabold shadow-sm border border-slate-200 dark:border-slate-700`}>
                                    {activeViewRole}
                                </span>
                            )}
                        </div>
                    </div>

                    <div className="flex items-center gap-4">
                        {/* Light/Dark Toggle */}
                        <button 
                            onClick={() => setIsDark(!isDark)} 
                            className="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors"
                            title="Toggle Light/Dark Theme"
                        >
                            <i data-lucide={isDark ? "sun" : "moon"} className="w-5 h-5"></i>
                        </button>

                        {/* Notification Bell */}
                        <div className="relative">
                            <button 
                                onClick={() => setShowNotifPanel(!showNotifPanel)}
                                className="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full relative transition-colors"
                            >
                                <i data-lucide="bell" className="w-5 h-5"></i>
                                {unreadCount > 0 && (
                                    <span className="absolute top-1 right-1 w-2.5 h-2.5 bg-rose-600 border-2 border-white dark:border-slate-900 rounded-full"></span>
                                )}
                            </button>

                            {/* Dropdown Notification Panel */}
                            {showNotifPanel && (
                                <div className="absolute right-0 mt-3 w-80 bg-white dark:bg-slate-850 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 py-2 z-50">
                                    <div className="px-4 py-2 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                                        <span className="font-bold text-sm">System Alerts</span>
                                        {unreadCount > 0 && (
                                            <button onClick={markAllRead} className={`text-xs ${theme.textAccent} font-semibold hover:underline`}>
                                                Mark all read
                                            </button>
                                        )}
                                    </div>
                                    <div className="max-h-64 overflow-y-auto">
                                        {notifs.length === 0 ? (
                                            <div className="p-4 text-center text-slate-400 text-xs">No alerts active</div>
                                        ) : (
                                            notifs.map(n => (
                                                <div key={n.id} className={`px-4 py-3 border-b border-slate-100 dark:border-slate-700/50 flex items-start gap-2.5 transition-colors ${!n.read ? theme.accentLight : ''}`}>
                                                    <span className={`w-2.5 h-2.5 rounded-full mt-1.5 flex-shrink-0 ${
                                                        n.type === 'Warning' ? 'bg-amber-500' :
                                                        n.type === 'Alert' ? 'bg-rose-500' :
                                                        n.type === 'Success' ? 'bg-emerald-500' : 'bg-blue-500'
                                                    }`}></span>
                                                    <div>
                                                        <p className="text-xs font-medium text-slate-700 dark:text-slate-200">{n.text}</p>
                                                        <span className="text-[10px] text-slate-400">{n.date}</span>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Profile Area */}
                        <div className="flex items-center gap-3 pl-4 border-l border-slate-200 dark:border-slate-800">
                            <img 
                                src={user.avatar} 
                                alt={user.name} 
                                className={`w-9 h-9 rounded-full object-cover border-2 ${theme.avatarBorder}`}
                            />
                            <div className="hidden md:block text-left">
                                <p className="text-sm font-semibold text-slate-800 dark:text-white leading-tight">{user.name}</p>
                                <span className={`text-xs ${theme.textAccent} font-medium`}>{user.role}</span>
                            </div>
                            <button 
                                onClick={onLogout}
                                className="ml-2 p-1.5 hover:bg-rose-100 hover:text-rose-600 dark:hover:bg-rose-955/40 rounded-lg text-slate-400 transition-colors"
                                title="Sign Out"
                            >
                                <i data-lucide="log-out" className="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </header>
            );
        };

        // ============================================================================
        // 5. MODULE TAB NAVIGATION HANDLER
        // ============================================================================
        
        const TabContainer = ({ activeTab, user, viewRole, triggerToast, setActiveTab }) => {
            switch(activeTab) {
                case 'dashboard':
                    return <DashboardView user={user} viewRole={viewRole} triggerToast={triggerToast} setActiveTab={setActiveTab} />;
                case 'projects':
                    return <ProjectsView user={user} viewRole={viewRole} triggerToast={triggerToast} />;
                case 'progress':
                    return <ProgressLogsView user={user} viewRole={viewRole} triggerToast={triggerToast} />;
                case 'resources':
                    return <ResourcesView user={user} viewRole={viewRole} triggerToast={triggerToast} />;
                case 'inventory':
                    return <InventoryView user={user} viewRole={viewRole} triggerToast={triggerToast} />;
                case 'workforce':
                    return <WorkforceView user={user} viewRole={viewRole} triggerToast={triggerToast} />;
                case 'procurement':
                    return <ProcurementView user={user} viewRole={viewRole} triggerToast={triggerToast} />;
                case 'budgets':
                    return <BudgetsView user={user} viewRole={viewRole} triggerToast={triggerToast} />;
                case 'reports':
                    return <ReportsView user={user} viewRole={viewRole} triggerToast={triggerToast} />;
                default:
                    return <DashboardView user={user} viewRole={viewRole} triggerToast={triggerToast} setActiveTab={setActiveTab} />;
            }
        };

        // ============================================================================
        // 6. DASHBOARD / OVERVIEW TAB (MODULE 9 & 11)
        // ============================================================================
        
        const DashboardView = ({ user, viewRole, triggerToast, setActiveTab }) => {
            const theme = getTheme(viewRole);
            const projects = db.projects;
            const resources = db.resources;
            const inventory = db.inventory;
            const workers = db.workers;

            const flirtyLine = React.useMemo(() => {
                const lines = [
                    "Are you a CSS class? Because you've got style. 😉",
                    "Are you a layout wrapper? Because you hold my whole page together. ❤️",
                    "Are you a Git repository? Because I'd commit to you anytime. 💻",
                    "Is your name Google? Because you have everything I've been searching for. ✨",
                    "Are you a keyboard? Because you're just my type. ⌨️",
                    "Are you a loop? Because I keep coming back to you. 🔄",
                    "Are you a database query? Because you've selected all of my heart. 🗄️",
                    "Is your server running hot, or are you just happy to see my commits? 🔥"
                ];
                return lines[Math.floor(Math.random() * lines.length)];
            }, []);

            // Get pending registration approvals managed by current user
            const getPendingApprovals = () => {
                const allUsers = getStored('users', INITIAL_USERS);
                const pending = allUsers.filter(u => u.status === 'Pending');
                if (user.role === 'Administrator') {
                    return pending.filter(u => u.role === 'Project Manager' || u.role === 'Client');
                }
                if (user.role === 'Project Manager') {
                    return pending.filter(u => u.role === 'Site Engineer');
                }
                if (user.role === 'Site Engineer') {
                    return pending.filter(u => u.role === 'Contractor');
                }
                if (user.role === 'Contractor') {
                    return pending.filter(u => u.role === 'Worker');
                }
                return [];
            };

            const [pendingUsers, setPendingUsers] = React.useState(() => getPendingApprovals());

            const handleApproveUser = (userId, userName) => {
                const allUsers = getStored('users', INITIAL_USERS);
                const updated = allUsers.map(u => {
                    if (u.id === userId) return { ...u, status: 'Active' };
                    return u;
                });
                db.users = updated;
                setStored('users', updated);
                syncDB();

                // Add system alert about registration approval
                const newAlert = {
                    id: `n-${Date.now()}`,
                    type: 'Success',
                    text: `User ${userName} request has been approved and activated.`,
                    read: false,
                    date: 'Just now'
                };
                db.notifications = [newAlert, ...db.notifications];
                setStored('notifications', db.notifications);

                setPendingUsers(pendingUsers.filter(u => u.id !== userId));
                triggerToast(`Approved registration for user "${userName}".`);
            };

            const handleDeclineUser = (userId, userName) => {
                const allUsers = getStored('users', INITIAL_USERS);
                const updated = allUsers.filter(u => u.id !== userId);
                db.users = updated;
                setStored('users', updated);
                syncDB();

                setPendingUsers(pendingUsers.filter(u => u.id !== userId));
                triggerToast(`Declined registration for user "${userName}".`, 'warning');
            };

            // Math computations
            const activeProjectsCount = projects.filter(p => p.status === 'Ongoing' || p.status === 'Delayed').length;
            const resourceUtilization = Math.round((resources.filter(r => r.status === 'Allocated').length / resources.length) * 100);
            const totalProjectBudget = projects.reduce((acc, curr) => acc + curr.budget, 0);
            const totalActualExpense = projects.reduce((acc, curr) => acc + curr.actualExpense, 0);
            const budgetPercent = Math.round((totalActualExpense / totalProjectBudget) * 100);

            // Recharts Data structures
            const progressChartData = projects.map(p => ({
                name: p.name.split(' ').slice(0,2).join(' '),
                Progress: p.progress,
                BudgetPercent: Math.round((p.actualExpense / p.budget) * 100)
            }));

            const budgetVsActualData = projects.map(p => ({
                name: p.name.split(' ').slice(0,2).join(' '),
                Allocated: p.budget / 1000,
                Expended: p.actualExpense / 1000
            }));

            React.useEffect(() => {
                lucide.createIcons();
            }, [pendingUsers]);

            return (
                <div className="space-y-6">
                    {/* Supervisor Approvals Panel */}
                    {pendingUsers.length > 0 && (
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4 font-Outfit">
                            <h3 className={`text-base font-bold flex items-center gap-2 ${theme.textAccent}`}>
                                <i data-lucide="shield-alert" className="w-5 h-5"></i>
                                Pending Registration Authorization Requests
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {pendingUsers.map(pUser => (
                                    <div key={pUser.id} className="p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/40 flex justify-between items-center">
                                        <div>
                                            <div className="flex items-center gap-2">
                                                <span className="font-bold text-sm text-slate-850 dark:text-white">{pUser.name}</span>
                                                <span className={`text-[10px] font-extrabold px-1.5 py-0.5 rounded ${theme.badgeBg}`}>
                                                    {pUser.role}
                                                </span>
                                            </div>
                                            <p className="text-xs text-slate-500 mt-1">Email: {pUser.email}</p>
                                            <p className="text-xs text-slate-400">Dept: {pUser.department}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button 
                                                onClick={() => handleApproveUser(pUser.id, pUser.name)}
                                                className={`text-white font-bold px-3 py-1.5 rounded-lg text-xs bg-emerald-600 hover:bg-emerald-700`}
                                            >
                                                Approve
                                            </button>
                                            <button 
                                                onClick={() => handleDeclineUser(pUser.id, pUser.name)}
                                                className="bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-350 font-bold px-3 py-1.5 rounded-lg text-xs"
                                            >
                                                Decline
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    {/* Header Banner */}
                    <div className="bg-gradient-to-r from-slate-900 to-slate-800 dark:from-slate-950 dark:to-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl flex items-center justify-between">
                        <div>
                            <h2 className="text-2xl font-bold text-white">Welcome back, {user.name}!</h2>
                            <p className="text-slate-400 mt-1">Here is a unified monitoring snapshot for all construction operations.</p>
                            <p className="text-amber-400 mt-2 text-xs font-semibold flex items-center gap-1.5 animate-pulse">
                                <i data-lucide="heart" className="w-3.5 h-3.5 text-rose-500 fill-rose-500"></i>
                                {flirtyLine}
                            </p>
                        </div>
                        <span className={`px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 ${theme.badgeBg}`}>
                            <i data-lucide="shield-check" className="w-5 h-5"></i>
                            Session Role: {user.role}
                        </span>
                    </div>

                    {/* Stats Widget Row */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <StatCard icon="building-2" title="Active Projects" value={activeProjectsCount} subtitle="Continuous construction" color={theme.accentName} />
                        <StatCard icon="circle-dollar-sign" title="Total Budget Used" value={`${budgetPercent}%`} subtitle={`$${(totalActualExpense/1e6).toFixed(2)}M of ${(totalProjectBudget/1e6).toFixed(2)}M`} color="emerald" />
                        <StatCard icon="truck" title="Heavy Equipment Active" value={`${resourceUtilization}%`} subtitle="Heavy units active" color="indigo" />
                        <StatCard icon="users" title="Labor Strengths" value={workers.length} subtitle="Assigned staff on sites" color="sky" />
                    </div>

                    {/* Charts & Visualization Section */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        
                        {/* Chart 1: Project Progress and Budgets */}
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-base font-bold">Project Progress vs Expense Ratios</h3>
                                <span className="text-xs bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded text-slate-500">Real-time tracker</span>
                            </div>
                            <div className="h-72">
                                <Recharts.ResponsiveContainer width="100%" height="100%">
                                    <Recharts.BarChart data={progressChartData}>
                                        <Recharts.CartesianGrid strokeDasharray="3 3" stroke="#334155" opacity={0.1} />
                                        <Recharts.XAxis dataKey="name" stroke="#64748b" fontSize={11} />
                                        <Recharts.YAxis stroke="#64748b" fontSize={11} />
                                        <Recharts.Tooltip contentStyle={{ background: '#1e293b', border: 'none', borderRadius: '8px', color: '#fff' }} />
                                        <Recharts.Legend />
                                        <Recharts.Bar dataKey="Progress" fill={theme.chartFill} radius={[4, 4, 0, 0]} name="Progress Completion %" />
                                        <Recharts.Bar dataKey="BudgetPercent" fill="#10b981" radius={[4, 4, 0, 0]} name="Budget Expended %" />
                                    </Recharts.BarChart>
                                </Recharts.ResponsiveContainer>
                            </div>
                        </div>

                        {/* Chart 2: Cost Structure */}
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-base font-bold">Financial Commitments ($ Thousands)</h3>
                                <span className="text-xs bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded text-slate-500">Allocated vs Spent</span>
                            </div>
                            <div className="h-72">
                                <Recharts.ResponsiveContainer width="100%" height="100%">
                                    <Recharts.AreaChart data={budgetVsActualData}>
                                        <Recharts.CartesianGrid strokeDasharray="3 3" stroke="#334155" opacity={0.1} />
                                        <Recharts.XAxis dataKey="name" stroke="#64748b" fontSize={11} />
                                        <Recharts.YAxis stroke="#64748b" fontSize={11} />
                                        <Recharts.Tooltip contentStyle={{ background: '#1e293b', border: 'none', borderRadius: '8px', color: '#fff' }} />
                                        <Recharts.Legend />
                                        <Recharts.Area type="monotone" dataKey="Allocated" stroke={theme.chartFill} fillOpacity={0.15} fill="url(#colorAllocated)" name="Budget ($k)" />
                                        <Recharts.Area type="monotone" dataKey="Expended" stroke="#ec4899" fillOpacity={0.15} fill="url(#colorSpent)" name="Expended ($k)" />
                                        <defs>
                                            <linearGradient id="colorAllocated" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="5%" stopColor={theme.chartFill} stopOpacity={0.4}/>
                                                <stop offset="95%" stopColor={theme.chartFill} stopOpacity={0}/>
                                            </linearGradient>
                                            <linearGradient id="colorSpent" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="5%" stopColor="#ec4899" stopOpacity={0.4}/>
                                                <stop offset="95%" stopColor="#ec4899" stopOpacity={0}/>
                                            </linearGradient>
                                        </defs>
                                    </Recharts.AreaChart>
                                </Recharts.ResponsiveContainer>
                            </div>
                        </div>

                    </div>

                    {/* Lower Widgets: Alerts, Inventory Warning & Quick Jumps */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        {/* Alerts Widget */}
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm lg:col-span-2">
                            <h3 className="text-base font-bold mb-4 flex items-center gap-2">
                                <i data-lucide="alert-triangle" className={`w-5 h-5 ${theme.textAccent}`}></i>
                                Critical Operational Incidents
                            </h3>
                            <div className="space-y-3">
                                {db.notifications.map(n => (
                                    <div key={n.id} className="flex justify-between items-center p-3 rounded-lg bg-slate-50 dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800">
                                        <div className="flex items-center gap-3">
                                            <span className={`w-2.5 h-2.5 rounded-full flex-shrink-0 ${
                                                n.type === 'Alert' ? 'bg-rose-500' :
                                                n.type === 'Warning' ? 'bg-amber-500' : 'bg-indigo-500'
                                            }`}></span>
                                            <p className="text-sm font-medium text-slate-700 dark:text-slate-300">{n.text}</p>
                                        </div>
                                        <span className="text-xs text-slate-400 whitespace-nowrap">{n.date}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Material Inventory Warning Widget */}
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                            <h3 className="text-base font-bold mb-4 flex items-center gap-2">
                                <i data-lucide="boxes" className={`w-5 h-5 ${theme.textAccent}`}></i>
                                Critical Stock Limits
                            </h3>
                            <div className="space-y-4">
                                {inventory.map(item => {
                                    const percent = Math.round((item.quantity / item.threshold) * 100);
                                    const isLow = item.quantity <= item.threshold;
                                    return (
                                        <div key={item.id} className="space-y-1">
                                            <div className="flex justify-between text-xs">
                                                <span className="font-semibold text-slate-700 dark:text-slate-300">{item.name}</span>
                                                <span className={isLow ? 'text-rose-500 font-bold' : 'text-slate-500'}>
                                                    {item.quantity} {item.unit} (Limit: {item.threshold})
                                                </span>
                                            </div>
                                            <div className="w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
                                                <div 
                                                    className={`h-full rounded-full transition-all duration-500 ${isLow ? 'bg-rose-500' : theme.bgAccent}`}
                                                    style={{ width: `${Math.min(percent, 100)}%` }}
                                                ></div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const StatCard = ({ icon, title, value, subtitle, color }) => {
            const colors = {
                amber: 'bg-amber-500/10 text-amber-500 border border-amber-500/20 hover:border-amber-500/50',
                emerald: 'bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 hover:border-emerald-500/50',
                indigo: 'bg-indigo-500/10 text-indigo-500 border border-indigo-500/20 hover:border-indigo-500/50',
                sky: 'bg-sky-500/10 text-sky-500 border border-sky-500/20 hover:border-sky-500/50',
                violet: 'bg-violet-500/10 text-violet-500 border border-violet-500/20 hover:border-violet-500/50',
                blue: 'bg-blue-500/10 text-blue-500 border border-blue-500/20 hover:border-blue-500/50',
                rose: 'bg-rose-500/10 text-rose-500 border border-rose-500/20 hover:border-rose-500/50',

                    <span className="text-xs text-slate-500 dark:text-slate-400 font-medium">{subtitle}</span>
                </div>

        };

        // ============================================================================
        // 7. PROJECTS & MILESTONES TAB (MODULE 2)
        // ============================================================================
        
        const ProjectsView = ({ user, viewRole, triggerToast }) => {
            const theme = getTheme(viewRole);
            const [projs, setProjs] = React.useState(db.projects);
            const [milestones, setMilestones] = React.useState(db.milestones);
            const [showAddForm, setShowAddForm] = React.useState(false);
            const [selectedProj, setSelectedProj] = React.useState(null);

            // New Project State variables
            const [name, setName] = React.useState('');
            const [category, setCategory] = React.useState('Commercial');
            const [client, setClient] = React.useState('');
            const [budget, setBudget] = React.useState('');
            const [location, setLocation] = React.useState('');
            const [startDate, setStartDate] = React.useState('');
            const [endDate, setEndDate] = React.useState('');

            const handleCreateProject = (e) => {
                e.preventDefault();
                if (!name || !client || !budget || !startDate || !endDate) {
                    triggerToast('Please complete all form fields.', 'error');
                    return;
                }

                const newProject = {
                    id: `p-${Date.now()}`,
                    name,
                    category,
                    client,
                    budget: parseFloat(budget),
                    actualExpense: 0,
                    status: 'Ongoing',
                    progress: 0,
                    location,
                    startDate,
                    endDate
                };

                const updated = [...projs, newProject];
                setProjs(updated);
                db.projects = updated;

                // Add default milestones for new project
                const defaultMilestones = [
                    { id: `m-${Date.now()}-1`, projectId: newProject.id, title: 'Geotechnical Excavation', phase: 'Foundation', status: 'Pending', dueDate: startDate, actualCompletionDate: null },
                    { id: `m-${Date.now()}-2`, projectId: newProject.id, title: 'Structural Columns Casting', phase: 'Structural Work', status: 'Pending', dueDate: endDate, actualCompletionDate: null }
                ];
                const updatedMilestones = [...milestones, ...defaultMilestones];
                setMilestones(updatedMilestones);
                db.milestones = updatedMilestones;

                syncDB();
                setShowAddForm(false);
                triggerToast(`Project "${name}" initialized successfully.`);

                // Reset forms
                setName('');
                setClient('');
                setBudget('');
                setLocation('');
                setStartDate('');
                setEndDate('');
            };

            const toggleMilestoneStatus = (mileId) => {
                const updated = milestones.map(m => {
                    if (m.id === mileId) {
                        const newStatus = m.status === 'Completed' ? 'Pending' : m.status === 'In Progress' ? 'Completed' : 'In Progress';
                        const compDate = newStatus === 'Completed' ? new Date().toISOString().substring(0,10) : null;
                        return { ...m, status: newStatus, actualCompletionDate: compDate };
                    }
                    return m;
                });
                setMilestones(updated);
                db.milestones = updated;

                // Dynamically update overall project progress percentage based on completed milestones
                if (selectedProj) {
                    const projMilestones = updated.filter(m => m.projectId === selectedProj.id);
                    if (projMilestones.length > 0) {
                        const completedCount = projMilestones.filter(m => m.status === 'Completed').length;
                        const progressPercent = Math.round((completedCount / projMilestones.length) * 100);
                        
                        db.projects = db.projects.map(p => {
                            if (p.id === selectedProj.id) {
                                const newP = { ...p, progress: progressPercent, status: progressPercent === 100 ? 'Completed' : p.status };
                                setSelectedProj(newP);
                                return newP;
                            }
                            return p;
                        });
                        setProjs(db.projects);
                    }
                }
                syncDB();
                triggerToast('Milestone structural status updated.');
            };

            const getStatusColor = (status) => {
                switch (status) {
                    case 'Completed': return 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-400';
                    case 'Ongoing': return 'bg-sky-100 text-sky-800 dark:bg-sky-900/30 dark:text-sky-400';
                    case 'Delayed': return 'bg-rose-100 text-rose-800 dark:bg-rose-900/30 dark:text-rose-400';
                    default: return 'bg-slate-100 text-slate-800 dark:bg-slate-850 dark:text-slate-400';

            React.useEffect(() => {
                lucide.createIcons();

            return (
                <div className="space-y-6">
                    {/* Toolbar Header */}
                    <div className="flex justify-between items-center">
                        <div>

                            <p className="text-sm text-slate-500">Track and schedule overall construction scopes</p>
                        </div>
                        {user.role === 'Project Manager' || user.role === 'Administrator' ? (

                                onClick={() => { setShowAddForm(!showAddForm); setSelectedProj(null); }}

                            >
                                <i data-lucide={showAddForm ? "arrow-left" : "plus"}></i>
                                {showAddForm ? 'Back to Projects' : 'Create Project'}
                            </button>
                        ) : null}
                    </div>

                    {showAddForm ? (
                        /* Create Project Form Workspace */
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm max-w-2xl">
                            <h3 className="text-lg font-bold mb-4">Initialize New Construction Scope</h3>
                            <form onSubmit={handleCreateProject} className="space-y-4">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Project Name</label>
                                        <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Oakridge Mall Extension" className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 ${theme.focusRing}`} required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Project Category</label>
                                        <select value={category} onChange={e => setCategory(e.target.value)} className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 ${theme.focusRing}`}>
                                            <option value="Commercial">Commercial</option>
                                            <option value="Residential">Residential</option>
                                            <option value="Industrial">Industrial</option>
                                            <option value="Infrastructure">Infrastructure</option>
                                            <option value="Government Projects">Government Projects</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Client Organization</label>
                                        <input type="text" value={client} onChange={e => setClient(e.target.value)} placeholder="e.g. Apex Retail Assets" className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 ${theme.focusRing}`} required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Total Budget Allocated ($)</label>
                                        <input type="number" value={budget} onChange={e => setBudget(e.target.value)} placeholder="e.g. 5200000" className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 ${theme.focusRing}`} required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Site Location</label>
                                        <input type="text" value={location} onChange={e => setLocation(e.target.value)} placeholder="e.g. Dallas, TX" className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 ${theme.focusRing}`} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Start Date</label>

                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">End Date</label>
                                            <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 ${theme.focusRing}`} required />
                                        </div>
                                    </div>
                                </div>
                                <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-lg text-sm transition-all duration-200 mt-2 shadow-lg shadow-emerald-600/10">
                                    Finalize Project Initialization
                                </button>
                            </form>
                        </div>
                    ) : selectedProj ? (
                        /* Project Milestones Detail View */
                        <div className="space-y-6">
                            <button 
                                onClick={() => setSelectedProj(null)} 
                                className="flex items-center gap-1.5 text-sm font-semibold hover:underline"
                            >
                                <i data-lucide="chevron-left" className="w-4 h-4"></i>
                                Back to Project List
                            </button>

                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                {/* Left: Info Details */}
                                <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                                    <div className="flex justify-between items-start">
                                        <h3 className="text-xl font-bold">{selectedProj.name}</h3>
                                        <span className={`px-2.5 py-1 rounded text-xs font-bold ${getStatusColor(selectedProj.status)}`}>
                                            {selectedProj.status}
                                        </span>
                                    </div>
                                    <p className="text-sm text-slate-500">Location: <span className="font-semibold text-slate-700 dark:text-slate-300">{selectedProj.location}</span></p>
                                    <p className="text-sm text-slate-500">Client: <span className="font-semibold text-slate-700 dark:text-slate-300">{selectedProj.client}</span></p>
                                    
                                    <div className="border-t border-slate-100 dark:border-slate-800 pt-4">
                                        <span className="text-xs font-bold text-slate-400 block mb-1">PROGESS MATRIX</span>
                                        <div className="flex items-center gap-2">
                                            <div className="flex-1 bg-slate-100 dark:bg-slate-800 h-3 rounded-full overflow-hidden">
                                                <div className={`${theme.progressColor} h-full`} style={{ width: `${selectedProj.progress}%` }}></div>
                                            </div>
                                            <span className="text-sm font-extrabold text-slate-800 dark:text-white">{selectedProj.progress}%</span>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4 pt-2">
                                        <div>
                                            <span className="text-[10px] font-bold text-slate-400 block uppercase">Budget Scope</span>
                                            <span className="text-lg font-extrabold text-slate-800 dark:text-white">${selectedProj.budget.toLocaleString()}</span>
                                        </div>
                                        <div>
                                            <span className="text-[10px] font-bold text-slate-400 block uppercase">Expense Logged</span>
                                            <span className="text-lg font-extrabold text-rose-500">${selectedProj.actualExpense.toLocaleString()}</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Right: Milestones & Schedule Flow */}
                                <div className="lg:col-span-2 bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                                    <h3 className="text-base font-bold mb-4 flex items-center gap-2">
                                        <i data-lucide="check-square" className={`w-5 h-5 ${theme.textAccent}`}></i>
                                        Scheduling Milestones & Phase Progress
                                    </h3>
                                    <div className="relative border-l-2 border-slate-200 dark:border-slate-850 ml-4 pl-6 space-y-6">
                                        {milestones.filter(m => m.projectId === selectedProj.id).map((m, idx) => (
                                            <div key={m.id} className="relative group">
                                                {/* Connecting node dot */}
                                                <button 
                                                    onClick={() => toggleMilestoneStatus(m.id)}
                                                    className={`absolute -left-10 top-0.5 w-7 h-7 rounded-full flex items-center justify-center transition-all duration-200 border-2 cursor-pointer ${
                                                        m.status === 'Completed' ? 'bg-emerald-500 border-emerald-600 text-white' : 
                                                        m.status === 'In Progress' ? `${theme.bgAccent} border-${theme.accentColor} text-white animate-pulse` : 
                                                        `bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-slate-400 hover:border-${theme.accentColor}`
                                                    }`}
                                                    title="Toggle Status (Pending -> In Progress -> Completed)"
                                                >
                                                    {m.status === 'Completed' ? <i data-lucide="check" className="w-4 h-4"></i> : idx + 1}
                                                </button>
                                                
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <h4 className="text-sm font-bold text-slate-850 dark:text-slate-100">{m.title}</h4>
                                                        <p className="text-xs text-slate-400 mt-0.5">Category: {m.phase}</p>
                                                        {m.actualCompletionDate && (
                                                            <span className="text-[10px] bg-emerald-100 text-emerald-800 dark:bg-emerald-955/40 dark:text-emerald-400 px-1.5 py-0.5 rounded font-semibold mt-1 inline-block">
                                                                Completed on: {m.actualCompletionDate}
                                                            </span>
                                                        )}
                                                    </div>
                                                    <div className="text-right">
                                                        <span className="text-xs font-semibold text-slate-500 dark:text-slate-400">Target: {m.dueDate}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        /* Projects Directory List */
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {projs.map(p => (
                                <div 
                                    key={p.id} 
                                    onClick={() => setSelectedProj(p)}
                                    className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm cursor-pointer hover:shadow-md transition-all duration-200 flex flex-col justify-between"
                                >
                                    <div>
                                        <div className="flex justify-between items-start gap-4 mb-3">
                                            <div>
                                                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">{p.category}</span>
                                                <h3 className={`text-lg font-bold mt-0.5 text-slate-850 dark:text-white hover:text-${theme.accentColor} transition-colors`}>{p.name}</h3>
                                            </div>
                                            <span className={`px-2 py-0.5 rounded text-xs font-bold ${getStatusColor(p.status)}`}>
                                                {p.status}
                                            </span>
                                        </div>
                                        <p className="text-sm text-slate-500 mb-4">{p.location}</p>
                                    </div>

                                    <div className="space-y-4">
                                        <div className="flex justify-between items-center text-xs">
                                            <span className="text-slate-400">Completion</span>
                                            <span className="font-bold text-slate-800 dark:text-white">{p.progress}%</span>
                                        </div>
                                        <div className="w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
                                            <div className={`${theme.progressColor} h-full rounded-full`} style={{ width: `${p.progress}%` }}></div>
                                        </div>

                                        <div className="flex justify-between border-t border-slate-100 dark:border-slate-800/80 pt-3 text-xs text-slate-500">
                                            <div>
                                                <span>Budget: </span>
                                                <strong className="text-slate-700 dark:text-slate-350">${(p.budget/1e3).toFixed(0)}k</strong>
                                            </div>
                                            <div>
                                                <span>Period: </span>
                                                <strong className="text-slate-700 dark:text-slate-300">{p.startDate} to {p.endDate}</strong>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // ============================================================================
        // 8. SITE PROGRESS MONITORING TAB (MODULE 3)
        // ============================================================================
        
        const ProgressLogsView = ({ user, viewRole, triggerToast }) => {
            const theme = getTheme(viewRole);
            const [logs, setLogs] = React.useState(db.dailyLogs);
            const [projectId, setProjectId] = React.useState(db.projects[0]?.id || '');
            const [workCompleted, setWorkCompleted] = React.useState('');
            const [delayTime, setDelayTime] = React.useState('0');
            const [delayReason, setDelayReason] = React.useState('None');

            const handleLogSubmit = (e) => {
                e.preventDefault();
                if (!workCompleted) {
                    triggerToast('Provide details about work finished.', 'error');
                    return;
                }

                const newLog = {
                    id: `dl-${Date.now()}`,
                    projectId,
                    date: new Date().toISOString().substring(0,10),
                    workCompleted,
                    delayTime: parseInt(delayTime),
                    delayReason: delayReason === 'None' ? 'None' : delayReason,
                    supervisorId: user.id
                };

                const updated = [newLog, ...logs];
                setLogs(updated);
                db.dailyLogs = updated;

                // Log system warning notification if a delay occurs
                if (parseInt(delayTime) > 0) {
                    const projName = db.projects.find(p => p.id === projectId)?.name || 'Project';
                    const newAlert = {
                        id: `n-${Date.now()}`,
                        type: 'Alert',
                        text: `${projName} reports a delay: ${workCompleted.slice(0, 30)}... (${delayTime} hrs - Reason: ${delayReason})`,
                        read: false,
                        date: 'Just now'
                    };
                    db.notifications = [newAlert, ...db.notifications];
                    
                    // Mark project status as delayed in database
                    db.projects = db.projects.map(p => {
                        if (p.id === projectId) return { ...p, status: 'Delayed' };
                        return p;
                    });
                }
                syncDB();
                triggerToast('Daily construction report updated.');

                // Reset forms
                setWorkCompleted('');
                setDelayTime('0');
                setDelayReason('None');
            };

            const getProjectName = (id) => db.projects.find(p => p.id === id)?.name || 'Unknown Project';

            React.useEffect(() => {
                lucide.createIcons();
            }, []);

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-xl font-bold">Site Progress & Logging Dashboard</h2>
                        <p className="text-sm text-slate-500">Record daily completions and track delay impacts</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Progress Log Submission Form */}
                        {user.role === 'Site Engineer' || user.role === 'Contractor' || user.role === 'Administrator' ? (
                            <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm h-fit">
                                <h3 className="text-base font-bold mb-4">Log Daily Site Activity</h3>
                                <form onSubmit={handleLogSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Site Project</label>
                                        <select value={projectId} onChange={e => setProjectId(e.target.value)} className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 ${theme.focusRing}`}>
                                            {db.projects.map(p => (
                                                <option key={p.id} value={p.id}>{p.name}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Detailed Activity Completed</label>
                                        <textarea 
                                            value={workCompleted} 
                                            onChange={e => setWorkCompleted(e.target.value)} 
                                            placeholder="Write summary of structural, electrical, or plumbing tasks done today..." 
                                            className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg text-sm h-28 focus:outline-none focus:ring-2 ${theme.focusRing}`} 
                                            required
                                        ></textarea>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Delays Logged (Hrs)</label>
                                            <select value={delayTime} onChange={e => setDelayTime(e.target.value)} className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 ${theme.focusRing}`}>
                                                <option value="0">0 Hours</option>
                                                <option value="2">2 Hours</option>
                                                <option value="4">4 Hours</option>
                                                <option value="8">8 Hours (Full Day)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Delay Category</label>
                                            <select value={delayReason} onChange={e => setDelayReason(e.target.value)} className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 ${theme.focusRing}`}>
                                                <option value="None">None</option>
                                                <option value="Material Shortage">Material Shortage</option>
                                                <option value="Machinery Breakdown">Machinery Breakdown</option>
                                                <option value="Weather Disruptions">Weather Disruptions</option>
                                                <option value="Workforce Scarcity">Workforce Scarcity</option>
                                                <option value="Safety Auditing">Safety Auditing</option>
                                            </select>
                                        </div>
                                    </div>
                                    <button type="submit" className={`w-full font-bold py-2 rounded-lg text-sm transition-all ${theme.buttonAccentClass}`}>
                                        Submit Daily Log
                                    </button>
                                </form>

        const InventoryView = ({ user, viewRole, triggerToast }) => {
            const theme = getTheme(viewRole);
            const [inventory, setInventory] = React.useState(db.inventory);
            const [requests, setRequests] = React.useState(db.materialRequests);

            // New Request form states
            const [selectedProj, setSelectedProj] = React.useState(db.projects[0]?.id || '');
            const [selectedMat, setSelectedMat] = React.useState(db.inventory[0]?.name || '');
            const [reqQty, setReqQty] = React.useState('');

            const handleMaterialRequest = (e) => {
                e.preventDefault();
                if (!reqQty || parseFloat(reqQty) <= 0) return;

                const selectedObj = inventory.find(i => i.name === selectedMat);

                const newReq = {
                    id: `mr-${Date.now()}`,
                    projectId: selectedProj,
                    materialName: selectedMat,
                    quantity: parseFloat(reqQty),
                    unit: selectedObj ? selectedObj.unit : 'Units',
                    status: 'Pending',
                    requester: user.name,
                    date: new Date().toISOString().substring(0,10)
                };

                const updated = [...requests, newReq];
                setRequests(updated);
                db.materialRequests = updated;
                syncDB();
                setReqQty('');
                triggerToast('Material procurement request logged.');
            };

            const handleApproveRequest = (reqId) => {
                const reqObj = requests.find(r => r.id === reqId);
                if (!reqObj) return;

                const invIndex = inventory.findIndex(i => i.name === reqObj.materialName);
                if (invIndex === -1) return;

                // Adjust local inventory balances
                const updatedInventory = [...inventory];
                if (updatedInventory[invIndex].quantity < reqObj.quantity) {
                    triggerToast('Insufficient stock reserves to approve.', 'error');
                    return;
                }

                updatedInventory[invIndex].quantity -= reqObj.quantity;
                setInventory(updatedInventory);
                db.inventory = updatedInventory;

                // Update request status
                const updatedRequests = requests.map(r => {
                    if (r.id === reqId) return { ...r, status: 'Approved' };
                    return r;
                });
                setRequests(updatedRequests);
                db.materialRequests = updatedRequests;

                // Auto notify low threshold if limit is reached
                if (updatedInventory[invIndex].quantity <= updatedInventory[invIndex].threshold) {
                    const newAlert = {
                        id: `n-${Date.now()}`,
                        type: 'Warning',
                        text: `Low inventory alert: ${updatedInventory[invIndex].name} has fallen below safety buffer limits.`,
                        read: false,
                        date: 'Just now'
                    };
                    db.notifications = [newAlert, ...db.notifications];
                }

                syncDB();
                triggerToast('Procurement request approved and stock subtracted.');
            };

            const getProjectName = (id) => db.projects.find(p => p.id === id)?.name || 'General Inventory';

                lucide.createIcons();

                                                <td className="py-3.5 px-2 text-slate-500">${item.costPerUnit}</td>
                                                <td className="py-3.5 px-2">
                                                    {item.quantity <= item.threshold ? (
                                                        <span className="bg-rose-100 text-rose-800 dark:bg-rose-955/40 dark:text-rose-400 text-xs px-2 py-0.5 rounded font-bold">
                                                            Low Stock

            const [shifts, setShifts] = React.useState(db.shifts);
            const [attendance, setAttendance] = React.useState(db.attendance);

            const [newWorkerName, setNewWorkerName] = React.useState('');
            const [newWorkerCategory, setNewWorkerCategory] = React.useState('Skilled Workers');
            const [newWorkerPhone, setNewWorkerPhone] = React.useState('');
            const [newWorkerWage, setNewWorkerWage] = React.useState('');

            // Attendance marking date (mocking today)
            const todayStr = new Date().toISOString().substring(0,10);
            const todayAttendance = attendance.find(a => a.date === todayStr) || { date: todayStr, presentIds: [] };

            const handleToggleAttendance = (workerId) => {
                let updatedPresent = [...todayAttendance.presentIds];
                if (updatedPresent.includes(workerId)) {
                    updatedPresent = updatedPresent.filter(id => id !== workerId);
                } else {
                    updatedPresent.push(workerId);
                }

                const updatedAttendanceRecords = attendance.some(a => a.date === todayStr)
                    ? attendance.map(a => a.date === todayStr ? { ...a, presentIds: updatedPresent } : a)
                    : [...attendance, { date: todayStr, presentIds: updatedPresent }];

                setAttendance(updatedAttendanceRecords);
                db.attendance = updatedAttendanceRecords;
                syncDB();
                triggerToast('Attendance status logged.');

                };

                const updated = [...workers, newW];

                db.workers = updated;
