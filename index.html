        const ProgressLogsView = ({ user, viewRole, triggerToast }) => {
            const theme = getTheme(viewRole);
            const [logs, setLogs] = React.useState(db.dailyLogs);
            const [projectId, setProjectId] = React.useState(db.projects[0]?.id || '');
            const [workCompleted, setWorkCompleted] = React.useState('');
            const [delayTime, setDelayTime] = React.useState('0');
            const [delayReason, setDelayReason] = React.useState('None');

            const handleLogSubmit = async (e) => {
                e.preventDefault();
                if (!workCompleted) {
                    triggerToast('Provide details about work finished.', 'error');
                    return;
                }

                const payload = {
                    projectId,
                    date: new Date().toISOString().substring(0, 10),
                    workCompleted,
                    delayTime: parseInt(delayTime),
                    delayReason: delayReason === 'None' ? 'None' : delayReason,
                    supervisorId: user.id
                };

                try {
                    const resData = await apiFetch('/api/progress-logs', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    if (resData.success) {
                        const newLog = {
                            id: resData.data._id || resData.data.id,
                            projectId,
                            date: payload.date,
                            workCompleted,
                            delayTime: payload.delayTime,
                            delayReason: payload.delayReason,
                            supervisorId: user.id
                        };

                        const updated = [newLog, ...logs];
                        setLogs(updated);
                        db.dailyLogs = updated;

                        // Log system warning notification if a delay occurs
                        if (parseInt(delayTime) > 0) {
                            const projName = db.projects.find(p => p.id === projectId)?.name || 'Project';
                            const newAlert = {
                                id: `n-${Date.now()}`,
                                type: 'Alert',
                                text: `${projName} reports a delay: ${workCompleted.slice(0, 30)}... (${delayTime} hrs - Reason: ${delayReason})`,
                                read: false,
                                date: 'Just now'
                            };
                            db.notifications = [newAlert, ...db.notifications];

                            // Update project status on server
                            await apiFetch(`/api/projects/${projectId}`, {
                                method: 'PUT',
                                body: JSON.stringify({ status: 'Delayed' })
                            });

                            // Mark project status as delayed in database
                            db.projects = db.projects.map(p => {
                                if (p.id === projectId) return { ...p, status: 'Delayed' };
                                return p;
                            });
                        }
                        syncDB();
                        triggerToast('Daily construction report updated.');

                        // Reset forms
                        setWorkCompleted('');
                        setDelayTime('0');
                        setDelayReason('None');
                    }
                } catch (err) {
                    console.error('Save daily log error:', err);
                    triggerToast('Failed to save daily log.', 'error');
                }
            };

            const getProjectName = (id) => db.projects.find(p => p.id === id)?.name || 'Unknown Project';

            React.useEffect(() => {
                lucide.createIcons();
            }, []);

            return (

                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Progress Log Submission Form */}
                        {user.role === 'Site Engineer' || user.role === 'Contractor' || user.role === 'Administrator' ? (
                            <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm h-fit">

                                <form onSubmit={handleLogSubmit} className="space-y-4">

                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Site Project</label>

                                            {db.projects.map(p => (
                                                <option key={p.id} value={p.id}>{p.name}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Detailed Activity Completed</label>
                                        <textarea
                                            value={workCompleted}
                                            onChange={e => setWorkCompleted(e.target.value)}
                                            placeholder="Write summary of structural, electrical, or plumbing tasks done today..."
                                            className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg text-sm h-28 focus:outline-none focus:ring-2 ${theme.focusRing}`}
                                            required
                                        ></textarea>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Delays Logged (Hrs)</label>
                                            <select value={delayTime} onChange={e => setDelayTime(e.target.value)} className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 ${theme.focusRing}`}>
                                                <option value="0">0 Hours</option>
                                                <option value="2">2 Hours</option>
                                                <option value="4">4 Hours</option>
                                                <option value="8">8 Hours (Full Day)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Delay Category</label>
                                            <select value={delayReason} onChange={e => setDelayReason(e.target.value)} className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 ${theme.focusRing}`}>
                                                <option value="None">None</option>
                                                <option value="Material Shortage">Material Shortage</option>
                                                <option value="Machinery Breakdown">Machinery Breakdown</option>
                                                <option value="Weather Disruptions">Weather Disruptions</option>
                                                <option value="Workforce Scarcity">Workforce Scarcity</option>
                                                <option value="Safety Auditing">Safety Auditing</option>
                                            </select>
                                        </div>
                                    </div>

                                        Submit Daily Log
                                    </button>
                                </form>
                            </div>
                        ) : (

                                <i data-lucide="lock" className="w-8 h-8 text-slate-400 mx-auto mb-2"></i>

                            <h3 className="text-base font-bold">Activity Reports Feed</h3>
                            <div className="space-y-4 max-h-[480px] overflow-y-auto pr-2">
                                {logs.map(log => (
                                    <div key={log.id} className="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800/80 space-y-2">

            const [selectedMat, setSelectedMat] = React.useState(db.inventory[0]?.name || '');
            const [reqQty, setReqQty] = React.useState('');

            const handleMaterialRequest = (e) => {
                e.preventDefault();
                if (!reqQty || parseFloat(reqQty) <= 0) return;

                const selectedObj = inventory.find(i => i.name === selectedMat);

                const newReq = {
                    id: `mr-${Date.now()}`,
                    projectId: selectedProj,
                    materialName: selectedMat,
                    quantity: parseFloat(reqQty),
                    unit: selectedObj ? selectedObj.unit : 'Units',
                    status: 'Pending',
                    requester: user.name,
                    date: new Date().toISOString().substring(0, 10)
                };

                const updated = [...requests, newReq];
                setRequests(updated);
                db.materialRequests = updated;
                syncDB();
                setReqQty('');
                triggerToast('Material procurement request logged.');
            };

            const handleApproveRequest = async (reqId) => {
                const reqObj = requests.find(r => r.id === reqId);
                if (!reqObj) return;

                const invIndex = inventory.findIndex(i => i.name === reqObj.materialName);
                if (invIndex === -1) return;

                const targetItem = inventory[invIndex];

                if (targetItem.quantity < reqObj.quantity) {
                    triggerToast('Insufficient stock reserves to approve.', 'error');
                    return;
                }

                const newQuantity = targetItem.quantity - reqObj.quantity;

                try {
                    const resData = await apiFetch(`/api/inventory/${targetItem.id}`, {
                        method: 'PUT',
                        body: JSON.stringify({
                            name: targetItem.name,
                            category: targetItem.category,
                            quantity: newQuantity,
                            unit: targetItem.unit,
                            threshold: targetItem.threshold,
                            costPerUnit: targetItem.costPerUnit
                        })
                    });

                    if (resData.success) {
                        // Adjust local inventory balances
                        const updatedInventory = [...inventory];
                        updatedInventory[invIndex].quantity = newQuantity;
                        setInventory(updatedInventory);
                        db.inventory = updatedInventory;

                        // Update request status
                        const updatedRequests = requests.map(r => {
                            if (r.id === reqId) return { ...r, status: 'Approved' };
                            return r;
                        });
                        setRequests(updatedRequests);
                        db.materialRequests = updatedRequests;

                        // Auto notify low threshold if limit is reached
                        if (newQuantity <= targetItem.threshold) {
                            const newAlert = {
                                id: `n-${Date.now()}`,
                                type: 'Warning',
                                text: `Low inventory alert: ${targetItem.name} has fallen below safety buffer limits.`,
                                read: false,
                                date: 'Just now'
                            };
                            db.notifications = [newAlert, ...db.notifications];
                        }

                        syncDB();
                        triggerToast('Procurement request approved and stock subtracted.');
                    }

                    console.error('Inventory approval update error:', err);
                    triggerToast('Failed to update inventory stock.', 'error');
                }

            const [newWorkerName, setNewWorkerName] = React.useState('');
            const [newWorkerCategory, setNewWorkerCategory] = React.useState('Skilled Workers');
            const [newWorkerPhone, setNewWorkerPhone] = React.useState('');
            const [newWorkerWage, setNewWorkerWage] = React.useState('');

            // Attendance marking date (mocking today)
            const todayStr = new Date().toISOString().substring(0, 10);
            const todayAttendance = attendance.find(a => a.date === todayStr) || { date: todayStr, presentIds: [] };

            const handleToggleAttendance = async (workerId) => {
                let updatedPresent = [...todayAttendance.presentIds];
                if (updatedPresent.includes(workerId)) {
                    updatedPresent = updatedPresent.filter(id => id !== workerId);
                } else {
                    updatedPresent.push(workerId);
                }

                try {
                    const resData = await apiFetch('/api/attendance', {
                        method: 'POST',
                        body: JSON.stringify({ date: todayStr, presentWorkers: updatedPresent })
                    });
                    if (resData.success) {
                        const updatedAttendanceRecords = attendance.some(a => a.date === todayStr)
                            ? attendance.map(a => a.date === todayStr ? { ...a, presentIds: updatedPresent } : a)
                            : [...attendance, { date: todayStr, presentIds: updatedPresent }];

                        setAttendance(updatedAttendanceRecords);
                        db.attendance = updatedAttendanceRecords;
                        syncDB();
                        triggerToast('Attendance status logged.');
                    }
                } catch (err) {
                    console.error('Attendance log error:', err);
                    triggerToast('Failed to log attendance.', 'error');
                }

            const handleCreateWorker = async (e) => {
                e.preventDefault();
                if (!newWorkerName || !newWorkerWage) return;

                const payload = {
                    name: newWorkerName,
                    category: newWorkerCategory,
                    phone: newWorkerPhone,
                    dailyWage: parseFloat(newWorkerWage),
                    status: 'Active'
                };

                if (!allocated) return;

                const payload = {

                    allocated: parseFloat(allocated),
                    actual: parseFloat(actual)
                };

                try {
                    const resData = await apiFetch(`/api/projects/${selectedProj}/budgets`, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    if (resData.success) {

                            projectId: selectedProj,
                            category,
                            allocated: parseFloat(allocated),
                            actual: parseFloat(actual)
                        };

                        const updated = [...budgets, newB];
                        setBudgets(updated);
                        db.budgets = updated;

                        // Find and update project in backend
                        const targetProjObj = db.projects.find(p => p.id === selectedProj);
                        if (targetProjObj) {
                            const newAllocated = targetProjObj.budget + parseFloat(allocated);
                            const newExpense = targetProjObj.actualExpense + parseFloat(actual);

                            await apiFetch(`/api/projects/${selectedProj}`, {
                                method: 'PUT',
                                body: JSON.stringify({
                                    budget: newAllocated,
                                    actualExpense: newExpense
                                })
                            });

                            db.projects = db.projects.map(p => {
                                if (p.id === selectedProj) {
                                    return { ...p, budget: newAllocated, actualExpense: newExpense };
                                }
                                return p;
                            });

                        setAllocated('');
                        setActual('0');
                        setShowBudgetForm(false);
                        triggerToast('Operational cost budget updated.');

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Allocated Budget ($)</label>
                                        <input type="number" value={allocated} onChange={e => setAllocated(e.target.value)} placeholder="e.g. 50000" className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 ${theme.focusRing}`} required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Expended Actually ($)</label>
                                        <input type="number" value={actual} onChange={e => setActual(e.target.value)} placeholder="e.g. 12000" className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 ${theme.focusRing}`} required />
                                    </div>
                                </div>
                                <button type="submit" className={`w-full font-bold py-2 rounded-lg text-sm transition-all ${theme.buttonAccentClass}`}>
                                    Confirm Cost Allocation
                                </button>
                            </form>
                        </div>
                    )}

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Budget Ledger Table */}
                        <div className="lg:col-span-2 bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                            <h3 className="text-base font-bold mb-4 font-Outfit">Budget Allocations Ledger</h3>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm border-collapse">
                                    <thead>
                                        <tr className="border-b border-slate-100 dark:border-slate-800 text-slate-400 font-semibold">
                                            <th className="py-3 px-2">Cost Category</th>
                                            <th className="py-3 px-2">Allocated budget</th>
                                            <th className="py-3 px-2">Actual Expended</th>
                                            <th className="py-3 px-2">Remaining balance</th>
                                            <th className="py-3 px-2">Burndown Chart</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {activeBudgets.map(b => {
                                            const remaining = b.allocated - b.actual;
                                            const percent = Math.round((b.actual / b.allocated) * 100);
                                            return (
                                                <tr key={b.id} className="border-b border-slate-50 dark:border-slate-800/50 hover:bg-slate-50/50 dark:hover:bg-slate-800/30">
                                                    <td className="py-3.5 px-2 font-bold text-slate-855 dark:text-white">{b.category}</td>
                                                    <td className="py-3.5 px-2 font-semibold">${b.allocated.toLocaleString()}</td>
                                                    <td className="py-3.5 px-2 font-semibold text-rose-500">${b.actual.toLocaleString()}</td>
                                                    <td className={`py-3.5 px-2 font-semibold ${remaining < 0 ? 'text-rose-500 font-bold' : 'text-slate-700 dark:text-slate-350'}`}>
                                                        ${remaining.toLocaleString()}
                                                    </td>
                                                    <td className="py-3.5 px-2">
                                                        <div className="flex items-center gap-2">
                                                            <div className="w-20 bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                                                                <div className={`h-full ${percent >= 90 ? 'bg-rose-500' : theme.progressColor}`} style={{ width: `${Math.min(percent, 100)}%` }}></div>
                                                            </div>
                                                            <span className="text-[10px] text-slate-400 font-bold">{percent}%</span>
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Cost breakdown Pie chart */}
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between">
                            <h3 className="text-base font-bold mb-4 font-Outfit">Expended Cost Breakdown</h3>
                            {pieChartData.length === 0 ? (
                                <p className="text-xs text-slate-400 py-10 text-center">No cost logs for this project.</p>
                            ) : (
                                <div className="h-64 flex flex-col justify-center">
                                    <Recharts.ResponsiveContainer width="100%" height="80%">
                                        <Recharts.PieChart>
                                            <Recharts.Pie
                                                data={pieChartData}
                                                cx="50%"
                                                cy="50%"
                                                innerRadius={60}
                                                outerRadius={80}
                                                paddingAngle={4}
                                                dataKey="value"
                                            >
                                                {pieChartData.map((entry, index) => (
                                                    <Recharts.Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                                                ))}
                                            </Recharts.Pie>
                                            <Recharts.Tooltip />
                                        </Recharts.PieChart>
                                    </Recharts.ResponsiveContainer>
                                    <div className="grid grid-cols-2 gap-2 text-[10px] text-slate-500 font-semibold mt-2">
                                        {pieChartData.map((d, index) => (
                                            <div key={d.name} className="flex items-center gap-1.5">
                                                <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: COLORS[index % COLORS.length] }}></span>
                                                <span className="truncate">{d.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // ============================================================================
        // 14. REPORTS & EXPORTER TAB (MODULE 10)
        // ============================================================================

        const ReportsView = ({ user, viewRole, triggerToast }) => {
            const theme = getTheme(viewRole);
            const [reportType, setReportType] = React.useState('Progress');
            const [selectedProj, setSelectedProj] = React.useState(db.projects[0]?.id || '');

            const generateExcelReport = () => {
                let data = [];
                const projObj = db.projects.find(p => p.id === selectedProj);
                const projName = projObj ? projObj.name : 'All Projects';

                if (reportType === 'Progress') {
                    // Export milestones & completion statuses
                    const milestones = db.milestones.filter(m => m.projectId === selectedProj);
                    data = milestones.map(m => ({
                        'Project Name': projName,
                        'Milestone Task': m.title,
                        'Construction Phase': m.phase,
                        'Target Due Date': m.dueDate,
                        'Completion Date': m.actualCompletionDate || 'Unfinished',
                        'Status': m.status
                    }));
                } else if (reportType === 'Budget') {
                    // Export budget breakdowns
                    const budgets = db.budgets.filter(b => b.projectId === selectedProj);
                    data = budgets.map(b => ({
                        'Project Name': projName,
                        'Cost Allocation Area': b.category,
                        'Allocated Amount ($)': b.allocated,
                        'Actual Expended ($)': b.actual,
                        'Remaining Balance ($)': b.allocated - b.actual
                    }));
                } else {
                    // Export inventory catalog
                    data = db.inventory.map(i => ({
                        'Material Name': i.name,
                        'Ledger Category': i.category,
                        'Current Quantity': i.quantity,
                        'Safety Buffer Limit': i.threshold,
                        'Measurement Unit': i.unit,
                        'Unit Price ($)': i.costPerUnit,
                        'Buffer Balance Status': i.quantity <= i.threshold ? 'CRITICAL BUFFER ALERT' : 'Sufficient'
                    }));
                }

                // Execute XLSX generation
                const worksheet = XLSX.utils.json_to_sheet(data);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, `${reportType} Summary`);

                // Trigger download
                XLSX.writeFile(workbook, `BuildTrack_${reportType}_Report_${new Date().toISOString().substring(0, 10)}.xlsx`);
                triggerToast('Excel spreadsheet report compiled & downloaded.');
            };

            const generatePDFReport = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const projObj = db.projects.find(p => p.id === selectedProj);
                const projName = projObj ? projObj.name : 'General Operations';

                // Add report header decorations
                doc.setFont("Helvetica", "bold");
                doc.setFontSize(22);
                doc.setTextColor(245, 158, 11); // Amber accent
                doc.text("BUILDTRACK ENTERPRISE", 15, 20);

                doc.setFontSize(10);
                doc.setTextColor(100, 116, 139);
                doc.text(`Generated: ${new Date().toLocaleString()}`, 15, 26);
                doc.text(`Scope: ${projName}`, 15, 31);

                doc.setDrawColor(226, 232, 240);
                doc.line(15, 35, 195, 35);

                doc.setFontSize(14);
                doc.setTextColor(30, 41, 59);
                doc.text(`${reportType} Summary Report`, 15, 45);

                doc.setFont("Helvetica", "normal");
                doc.setFontSize(10);

                let startY = 55;
                if (reportType === 'Progress') {
                    const milestones = db.milestones.filter(m => m.projectId === selectedProj);
                    milestones.forEach((m, idx) => {
                        doc.text(`${idx + 1}. Task: ${m.title}`, 15, startY);
                        doc.text(`Phase: ${m.phase} | Due: ${m.dueDate} | Status: ${m.status}`, 15, startY + 5);
                        startY += 15;
                    });
                } else if (reportType === 'Budget') {
                    const budgets = db.budgets.filter(b => b.projectId === selectedProj);
                    budgets.forEach((b, idx) => {
                        const bal = b.allocated - b.actual;
                        doc.text(`${idx + 1}. Category: ${b.category}`, 15, startY);
                        doc.text(`Budget: $${b.allocated.toLocaleString()} | Expended: $${b.actual.toLocaleString()} | Balance: $${bal.toLocaleString()}`, 15, startY + 5);
                        startY += 15;
                    });
                } else {
                    db.inventory.forEach((i, idx) => {
                        doc.text(`${idx + 1}. Material: ${i.name}`, 15, startY);
                        doc.text(`Category: ${i.category} | Qty: ${i.quantity} ${i.unit} | Buffet limit: ${i.threshold}`, 15, startY + 5);
                        startY += 15;
                    });
                }

                doc.save(`BuildTrack_${reportType}_Report_${new Date().toISOString().substring(0, 10)}.pdf`);
                triggerToast('PDF report compiled & downloaded.');
            };

            React.useEffect(() => {
                lucide.createIcons();
            }, []);

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-xl font-bold">Reports & Documentation Center</h2>
                        <p className="text-sm text-slate-500">Compile and export verified construction data logs to Excel and PDF formats</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">

                        {/* Selector console */}
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-5 h-fit">
                            <h3 className="text-base font-bold">Compilation Wizard</h3>

                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Select Construction Project</label>
                                    <select value={selectedProj} onChange={e => setSelectedProj(e.target.value)} className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 ${theme.focusRing}`}>
                                        {db.projects.map(p => (
                                            <option key={p.id} value={p.id}>{p.name}</option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Report category Type</label>
                                    <div className="grid grid-cols-3 gap-2">
                                        {['Progress', 'Budget', 'Inventory'].map(type => (
                                            <button
                                                key={type}
                                                onClick={() => setReportType(type)}
                                                className={`py-2 px-3 rounded-lg text-xs font-bold transition-all border ${reportType === type
                                                    ? theme.buttonClass
                                                    : 'bg-slate-50 dark:bg-slate-850 border border-slate-200 dark:border-slate-750 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800'
                                                    }`}
                                            >
                                                {type} Summary
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className="flex gap-4 pt-4 border-t border-slate-100 dark:border-slate-800">
                                <button
                                    onClick={generateExcelReport}
                                    className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/10"
                                >
                                    <i data-lucide="file-spreadsheet"></i>
                                    Export Excel Spreadsheet
                                </button>
                                <button
                                    onClick={generatePDFReport}
                                    className="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl text-sm flex items-center justify-center gap-2 shadow-lg shadow-rose-600/10"
                                >
                                    <i data-lucide="file-signature"></i>
                                    Export PDF Document
                                </button>
                            </div>
                        </div>

                        {/* Report Preview panel */}
                        <div className="bg-slate-900 text-slate-300 p-6 rounded-2xl border border-slate-850 shadow-2xl space-y-4">
                            <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                <span className="text-xs font-bold text-slate-500 font-mono">PREVIEW CONSOLE</span>
                                <span className={`text-xs font-bold font-mono ${theme.textAccent}`}>BuildTrack_Report.tmp</span>
                            </div>

                            <div className="font-mono text-xs space-y-4 overflow-y-auto max-h-[360px] leading-relaxed">
                                <div>
                                    <p className="text-slate-400"># BUILDTRACK SYSTEM EXPORT LOG</p>
                                    <p>Timestamp : {new Date().toISOString()}</p>
                                    <p>Exporter  : {user.name} ({user.role})</p>
                                    <p>Target    : {db.projects.find(p => p.id === selectedProj)?.name}</p>
                                </div>
                                <hr className="border-slate-800" />
                                {reportType === 'Progress' ? (
                                    <div>
                                        <p className={`font-bold ${theme.textAccent}`}>// MILESTONE PHASE AUDITS</p>
                                        {db.milestones.filter(m => m.projectId === selectedProj).map((m, idx) => (
                                            <p key={m.id} className="mt-1">
                                                [{idx + 1}] [{m.status.toUpperCase()}] {m.title} (Due: {m.dueDate})
                                            </p>
                                        ))}
                                    </div>
                                ) : reportType === 'Budget' ? (
                                    <div>
                                        <p className={`font-bold ${theme.textAccent}`}>// FINANCIAL BREAKDOWN REGISTER</p>
                                        {db.budgets.filter(b => b.projectId === selectedProj).map((b, idx) => (
                                            <p key={b.id} className="mt-1">
                                                [{idx + 1}] {b.category}: Allocated ${b.allocated} | Spent ${b.actual}
                                            </p>
                                        ))}
                                    </div>
                                ) : (
                                    <div>
                                        <p className={`font-bold ${theme.textAccent}`}>// INVENTORY LEDGER IN-STOCK BALANCES</p>
                                        {db.inventory.map((i, idx) => (
                                            <p key={i.id} className="mt-1">
                                                [{idx + 1}] {i.name}: {i.quantity} {i.unit} in-stock (Min Buffer: {i.threshold})
                                            </p>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        // Render application elements
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
