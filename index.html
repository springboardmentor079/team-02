                    console.error('Failed to save project:', err);
                    triggerToast('Network error: Unable to save project.', 'error');
                }
            };

            const handleStartEdit = (proj) => {
                setName(proj.name);
                setCategory(proj.category);
                setClient(proj.client);
                setBudget(proj.budget);
                setLocation(proj.location || '');
                setStartDate(proj.startDate);
                setEndDate(proj.endDate);
                setProgress(proj.progress || 0);
                setActualExpense(proj.actualExpense || 0);
                setStatus(proj.status || 'Ongoing');
                setEditingProjId(proj.id);
                setIsEditing(true);
                setShowAddForm(true);
                setSelectedProj(null);
            };

            const handleStartDelete = (id) => {
                setDeletingProjId(id);
                setShowDeleteConfirm(true);
            };

            const handleDeleteProject = async () => {
                try {
                    const resData = await apiFetch(`/api/projects/${deletingProjId}`, {
                        method: 'DELETE'
                    });
                    if (resData.success) {
                        const updated = projs.filter(p => p.id !== deletingProjId);
                        setProjs(updated);
                        db.projects = updated;
                        syncDB();
                        triggerToast('Project deleted successfully.', 'warning');
                    } else {
                        triggerToast(resData.msg || 'Failed to delete project.', 'error');
                    }
                } catch (err) {
                    console.error('Delete error:', err);
                    triggerToast('Network error: Unable to delete project.', 'error');
                }
                setShowDeleteConfirm(false);
                setDeletingProjId('');
            };

            const toggleMilestoneStatus = async (mileId) => {
                const target = milestones.find(m => m.id === mileId);
                if (!target) return;

                const newStatus = target.status === 'Completed' ? 'Pending' : target.status === 'In Progress' ? 'Completed' : 'In Progress';
                const compDate = newStatus === 'Completed' ? new Date().toISOString().substring(0, 10) : null;

                try {
                    const resData = await apiFetch(`/api/milestones/${mileId}`, {
                        method: 'PUT',
                        body: JSON.stringify({ status: newStatus, actualCompletionDate: compDate })
                    });

                    if (resData.success) {
                        const updated = milestones.map(m => {
                            if (m.id === mileId) {
                                return { ...m, status: newStatus, actualCompletionDate: compDate };
                            }
                            return m;
                        });
                        setMilestones(updated);
                        db.milestones = updated;

                        // Dynamically update overall project progress percentage based on completed milestones
                        if (selectedProj) {
                            const projMilestones = updated.filter(m => m.projectId === selectedProj.id);
                            if (projMilestones.length > 0) {
                                const completedCount = projMilestones.filter(m => m.status === 'Completed').length;
                                const progressPercent = Math.round((completedCount / projMilestones.length) * 100);

                                // Update overall project progress in backend
                                await apiFetch(`/api/projects/${selectedProj.id}`, {
                                    method: 'PUT',
                                    body: JSON.stringify({ progress: progressPercent, status: progressPercent === 100 ? 'Completed' : selectedProj.status })
                                });

                                db.projects = db.projects.map(p => {
                                    if (p.id === selectedProj.id) {
                                        const newP = { ...p, progress: progressPercent, status: progressPercent === 100 ? 'Completed' : p.status };
                                        setSelectedProj(newP);
                                        return newP;
                                    }
                                    return p;
                                });
                                setProjs(db.projects);
                            }
                        }
                        syncDB();
                        triggerToast('Milestone structural status updated.');
                    }
                } catch (err) {
                    console.error('Milestone toggle error:', err);
                    triggerToast('Failed to update milestone status.', 'error');
                }
            };

            const getStatusColor = (status) => {
                switch (status) {
                    case 'Completed': return 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-400';
                    case 'Ongoing': return 'bg-sky-100 text-sky-800 dark:bg-sky-900/30 dark:text-sky-400';
                    case 'Delayed': return 'bg-rose-100 text-rose-800 dark:bg-rose-900/30 dark:text-rose-400';
                    default: return 'bg-slate-100 text-slate-800 dark:bg-slate-850 dark:text-slate-400';
                }
            };

            React.useEffect(() => {
                lucide.createIcons();
            }, [showAddForm, selectedProj, showDeleteConfirm, isEditing]);

            return (
                <div className="space-y-6">
                    {/* Toolbar Header */}
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-xl font-bold">Project Management Hub</h2>
                            <p className="text-sm text-slate-500">Track and schedule overall construction scopes</p>
                        </div>
                        {user.role === 'Project Manager' || user.role === 'Administrator' ? (
                            <button
                                onClick={() => {
                                    if (showAddForm) {
                                        setShowAddForm(false);
                                        setIsEditing(false);
                                        setEditingProjId('');
                                        setName('');
                                        setClient('');
                                        setBudget('');
                                        setLocation('');
                                        setStartDate('');
                                        setEndDate('');
                                    } else {
                                        setShowAddForm(true);
                                        setSelectedProj(null);
                                    }
                                }}
                                className={`font-bold px-4 py-2 rounded-xl text-sm flex items-center gap-2 ${theme.buttonClass}`}
                            >
                                <i data-lucide={showAddForm ? "arrow-left" : "plus"}></i>
                                {showAddForm ? 'Back to Projects' : 'Create Project'}
                            </button>
                        ) : null}
                    </div>

                    {showAddForm ? (
                        /* Create / Edit Project Form Workspace */
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm max-w-2xl">
                            <h3 className="text-lg font-bold mb-4">{isEditing ? 'Edit Construction Scope' : 'Initialize New Construction Scope'}</h3>
                            <form onSubmit={handleSaveProject} className="space-y-4">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Project Name</label>
                                        <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Oakridge Mall Extension" className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 ${theme.focusRing}`} required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Project Category</label>
                                        <select value={category} onChange={e => setCategory(e.target.value)} className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 ${theme.focusRing}`}>
                                            <option value="Commercial">Commercial</option>
                                            <option value="Residential">Residential</option>
                                            <option value="Industrial">Industrial</option>
                                            <option value="Infrastructure">Infrastructure</option>
                                            <option value="Government Projects">Government Projects</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Client Organization</label>
                                        <input type="text" value={client} onChange={e => setClient(e.target.value)} placeholder="e.g. Apex Retail Assets" className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 ${theme.focusRing}`} required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Total Budget Allocated ($)</label>
                                        <input type="number" value={budget} onChange={e => setBudget(e.target.value)} placeholder="e.g. 5200000" className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 ${theme.focusRing}`} required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Site Location</label>
                                        <input type="text" value={location} onChange={e => setLocation(e.target.value)} placeholder="e.g. Dallas, TX" className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 ${theme.focusRing}`} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Start Date</label>
                                            <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 ${theme.focusRing}`} required />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">End Date</label>
                                            <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 ${theme.focusRing}`} required />
                                        </div>
                                    </div>

                                    {isEditing && (
                                        <>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Status</label>
                                                <select value={status} onChange={e => setStatus(e.target.value)} className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 ${theme.focusRing}`}>
                                                    <option value="Planning">Planning</option>
                                                    <option value="Ongoing">Ongoing</option>
                                                    <option value="Delayed">Delayed</option>
                                                    <option value="Completed">Completed</option>
                                                    <option value="Closed">Closed</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Actual Expense ($)</label>
                                                <input type="number" value={actualExpense} onChange={e => setActualExpense(e.target.value)} className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 ${theme.focusRing}`} />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Progress ({progress}%)</label>
                                                <input type="range" min="0" max="100" value={progress} onChange={e => setProgress(e.target.value)} className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600 dark:bg-slate-800" />
                                            </div>
                                        </>
                                    )}
                                </div>
                                <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-lg text-sm transition-all duration-200 mt-2 shadow-lg shadow-emerald-600/10">
                                    {isEditing ? 'Save Project Changes' : 'Finalize Project Initialization'}
                                </button>
                            </form>
                        </div>
                    ) : selectedProj ? (
                        /* Project Milestones Detail View */
                        <div className="space-y-6">
                            <button
                                onClick={() => setSelectedProj(null)}
                                className="flex items-center gap-1.5 text-sm font-semibold hover:underline"
                            >
                                <i data-lucide="chevron-left" className="w-4 h-4"></i>
                                Back to Project List
                            </button>

                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                {/* Left: Info Details */}
                                <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                                    <div className="flex justify-between items-start">
                                        <h3 className="text-xl font-bold">{selectedProj.name}</h3>
                                        <span className={`px-2.5 py-1 rounded text-xs font-bold ${getStatusColor(selectedProj.status)}`}>
                                            {selectedProj.status}
                                        </span>
                                    </div>
                                    <p className="text-sm text-slate-500">Location: <span className="font-semibold text-slate-700 dark:text-slate-300">{selectedProj.location}</span></p>
                                    <p className="text-sm text-slate-500">Client: <span className="font-semibold text-slate-700 dark:text-slate-300">{selectedProj.client}</span></p>
                                    {selectedProj.projectManager && (
                                        <p className="text-sm text-slate-500">Manager: <span className="font-semibold text-slate-700 dark:text-slate-350">{selectedProj.projectManager.name} ({selectedProj.projectManager.email})</span></p>
                                    )}

                                    <div className="border-t border-slate-100 dark:border-slate-800 pt-4">
                                        <span className="text-xs font-bold text-slate-400 block mb-1">PROGESS MATRIX</span>
                                        <div className="flex items-center gap-2">
                                            <div className="flex-1 bg-slate-100 dark:bg-slate-800 h-3 rounded-full overflow-hidden">
                                                <div className={`${theme.progressColor} h-full`} style={{ width: `${selectedProj.progress}%` }}></div>
                                            </div>
                                            <span className="text-sm font-extrabold text-slate-800 dark:text-white">{selectedProj.progress}%</span>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4 pt-2">
                                        <div>
                                            <span className="text-[10px] font-bold text-slate-400 block uppercase">Budget Scope</span>
                                            <span className="text-lg font-extrabold text-slate-800 dark:text-white">${selectedProj.budget.toLocaleString()}</span>
                                        </div>
                                        <div>
                                            <span className="text-[10px] font-bold text-slate-400 block uppercase">Expense Logged</span>
                                            <span className="text-lg font-extrabold text-rose-500">${selectedProj.actualExpense.toLocaleString()}</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Right: Milestones & Schedule Flow */}
                                <div className="lg:col-span-2 bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                                    <h3 className="text-base font-bold mb-4 flex items-center gap-2">
                                        <i data-lucide="check-square" className={`w-5 h-5 ${theme.textAccent}`}></i>
                                        Scheduling Milestones & Phase Progress
                                    </h3>
                                    <div className="relative border-l-2 border-slate-200 dark:border-slate-850 ml-4 pl-6 space-y-6">
                                        {milestones.filter(m => m.projectId === selectedProj.id).map((m, idx) => (
                                            <div key={m.id} className="relative group">
                                                {/* Connecting node dot */}
                                                <button
                                                    onClick={() => toggleMilestoneStatus(m.id)}
                                                    className={`absolute -left-10 top-0.5 w-7 h-7 rounded-full flex items-center justify-center transition-all duration-205 border-2 cursor-pointer ${m.status === 'Completed' ? 'bg-emerald-500 border-emerald-600 text-white' :
                                                        m.status === 'In Progress' ? `${theme.bgAccent} border-${theme.accentColor} text-white animate-pulse` :
                                                            `bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-slate-400 hover:border-${theme.accentColor}`
                                                        }`}
                                                    title="Toggle Status (Pending → In Progress → Completed)"
                                                >
                                                    {m.status === 'Completed' ? <i data-lucide="check" className="w-4 h-4"></i> : idx + 1}
                                                </button>

                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <h4 className="text-sm font-bold text-slate-850 dark:text-slate-100">{m.title}</h4>
                                                        <p className="text-xs text-slate-400 mt-0.5">Category: {m.phase}</p>
                                                        {m.actualCompletionDate && (
                                                            <span className="text-[10px] bg-emerald-100 text-emerald-800 dark:bg-emerald-955/40 dark:text-emerald-400 px-1.5 py-0.5 rounded font-semibold mt-1 inline-block">
                                                                Completed on: {m.actualCompletionDate}
                                                            </span>
                                                        )}
                                                    </div>
                                                    <div className="text-right">
                                                        <span className="text-xs font-semibold text-slate-500 dark:text-slate-400">Target: {m.dueDate}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        /* Projects Directory List */
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {projs.map(p => (
                                <div
                                    key={p.id}
                                    onClick={() => setSelectedProj(p)}
                                    className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm cursor-pointer hover:shadow-md transition-all duration-200 flex flex-col justify-between"
                                >
                                    <div>
                                        <div className="flex justify-between items-start gap-4 mb-3">
                                            <div className="flex-1">
                                                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">{p.category}</span>
                                                <h3 className={`text-lg font-bold mt-0.5 text-slate-850 dark:text-white hover:text-${theme.accentColor} transition-colors`}>{p.name}</h3>
                                            </div>
                                            <div className="flex items-center gap-2 flex-shrink-0">
                                                <span className={`px-2 py-0.5 rounded text-xs font-bold ${getStatusColor(p.status)}`}>
                                                    {p.status}
                                                </span>
                                                {(user.role === 'Project Manager' || user.role === 'Administrator') && (
                                                    <div className="flex gap-1">
                                                        <button
                                                            onClick={(e) => { e.stopPropagation(); handleStartEdit(p); }}
                                                            className="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded transition-colors text-blue-500 border border-blue-500/10"
                                                            title="Edit Project"
                                                        >
                                                            <i data-lucide="pencil" className="w-3.5 h-3.5"></i>
                                                        </button>
                                                        <button
                                                            onClick={(e) => { e.stopPropagation(); handleStartDelete(p.id); }}
                                                            className="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded transition-colors text-rose-500 border border-rose-500/10"
                                                            title="Delete Project"
                                                        >
                                                            <i data-lucide="trash" className="w-3.5 h-3.5"></i>
                                                        </button>
                                                    </div>
                                                )}
                                            </div>

        const ProgressLogsView = ({ user, viewRole, triggerToast }) => {

            const [projectId, setProjectId] = React.useState(db.projects[0]?.id || '');
            const [workCompleted, setWorkCompleted] = React.useState('');
            const [delayTime, setDelayTime] = React.useState('0');
            const [delayReason, setDelayReason] = React.useState('None');

            const handleLogSubmit = async (e) => {
                e.preventDefault();
                if (!workCompleted) {
                    triggerToast('Provide details about work finished.', 'error');
                    return;
                }

                const payload = {
                    projectId,
                    date: new Date().toISOString().substring(0, 10),
                    workCompleted,
                    delayTime: parseInt(delayTime),
                    delayReason: delayReason === 'None' ? 'None' : delayReason,
                    supervisorId: user.id
                };

                try {
                    const resData = await apiFetch('/api/progress-logs', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    if (resData.success) {
                        const newLog = {
                            id: resData.data._id || resData.data.id,
                            projectId,
                            date: payload.date,
                            workCompleted,
                            delayTime: payload.delayTime,
                            delayReason: payload.delayReason,
                            supervisorId: user.id
                        };

                        const updated = [newLog, ...logs];
                        setLogs(updated);
                        db.dailyLogs = updated;

                        // Log system warning notification if a delay occurs
                        if (parseInt(delayTime) > 0) {
                            const projName = db.projects.find(p => p.id === projectId)?.name || 'Project';
                            const newAlert = {
                                id: `n-${Date.now()}`,
                                type: 'Alert',
                                text: `${projName} reports a delay: ${workCompleted.slice(0, 30)}... (${delayTime} hrs - Reason: ${delayReason})`,
                                read: false,
                                date: 'Just now'
                            };
                            db.notifications = [newAlert, ...db.notifications];

                            // Update project status on server
                            await apiFetch(`/api/projects/${projectId}`, {
                                method: 'PUT',
                                body: JSON.stringify({ status: 'Delayed' })
                            });

                            // Mark project status as delayed in database
                            db.projects = db.projects.map(p => {
                                if (p.id === projectId) return { ...p, status: 'Delayed' };
                                return p;
                            });
                        }
                        syncDB();
                        triggerToast('Daily construction report updated.');

                        // Reset forms
                        setWorkCompleted('');
                        setDelayTime('0');
                        setDelayReason('None');
                    }

                    console.error('Save daily log error:', err);
                    triggerToast('Failed to save daily log.', 'error');

                verifiedByName: user.name || 'Site Engineer'
            });

            const fetchInventoryData = async () => {
                try {
                    const res = await apiFetch('/api/inventory');
                    if (res && res.data && Array.isArray(res.data)) {
                        setInventory(res.data);
                        db.inventory = res.data;
                        saveStored('inventory', res.data);
                    }
                } catch (e) { }
            };

            const fetchDeliveriesData = async () => {
                try {
                    const res = await apiFetch('/api/inventory/deliveries');
                    if (res && res.data && Array.isArray(res.data)) {
                        setDeliveries(res.data);
                    }
                } catch (e) { }
            };

            React.useEffect(() => {
                fetchInventoryData();
                fetchDeliveriesData();
                setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 50);
            }, [showAddModal, addStockModalItem, editModalItem, showDispatchModal, selectedDeliveryForVerification, inventoryTab]);

            const handleAddInventory = async (e) => {
                e.preventDefault();
                if (!newItemForm.name || !newItemForm.quantity || !newItemForm.unit) {
                    triggerToast('Please fill in required material details.');
                    return;
                }

                try {
                    const payload = {
                        name: newItemForm.name,
                        category: newItemForm.category,
                        quantity: parseFloat(newItemForm.quantity) || 0,
                        unit: newItemForm.unit,
                        threshold: parseFloat(newItemForm.threshold) || 10,
                        costPerUnit: parseFloat(newItemForm.costPerUnit) || 0
                    };

                    await apiFetch('/api/inventory', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    await fetchInventoryData();

                    setShowAddModal(false);
                    setNewItemForm({ name: '', category: 'Cement', quantity: '', unit: 'Bags', threshold: '50', costPerUnit: '10' });
                    triggerToast(`Material "${payload.name}" registered successfully.`);
                } catch (err) {
                    console.error('Error registering material:', err);
                    triggerToast('Material item registered.');
                    setShowAddModal(false);
                }
            };

            const handleContractorDispatch = async (e) => {
                e.preventDefault();
                if (!dispatchForm.materialName || !dispatchForm.dispatchedQuantity) {
                    triggerToast('Please provide material name and dispatched quantity.');
                    return;
                }

                try {
                    const payload = {
                        ...dispatchForm,
                        dispatchedQuantity: parseFloat(dispatchForm.dispatchedQuantity) || 0
                    };

                    const res = await apiFetch('/api/inventory/deliveries', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    await fetchDeliveriesData();
                    setShowDispatchModal(false);
                    setDispatchForm({
                        materialName: '',
                        category: 'Cement',
                        contractorName: user.name || 'Contractor',
                        projectName: db.projects[0]?.name || 'Metro Station Extension Project',
                        dispatchedQuantity: '',
                        unit: 'Bags',
                        notes: ''
                    });
                    setInventoryTab('deliveries');
                    triggerToast(res.msg || 'Shipment dispatched! Site Engineer notified for verification.');
                } catch (err) {
                    console.error('Dispatch error:', err);
                    triggerToast('Shipment dispatch recorded.');
                    setShowDispatchModal(false);
                }
            };

            const handleSiteEngineerVerify = async (e, rejectShipment = false) => {
                if (e) e.preventDefault();
                if (user.role !== 'Site Engineer' && viewRole !== 'Site Engineer') {
                    triggerToast('Physical verification can ONLY be performed by a Site Engineer on site.');
                    return;
                }
                if (!selectedDeliveryForVerification) return;

                const targetId = selectedDeliveryForVerification._id || selectedDeliveryForVerification.id;

                try {
                    const payload = {
                        receivedQuantity: parseFloat(verificationForm.receivedQuantity) || 0,
                        okQuantity: parseFloat(verificationForm.okQuantity) || 0,
                        defectiveQuantity: parseFloat(verificationForm.defectiveQuantity) || 0,
                        verificationNotes: verificationForm.verificationNotes,
                        verifiedByName: verificationForm.verifiedByName,
                        rejectShipment
                    };

                    const res = await apiFetch(`/api/inventory/deliveries/${targetId}/verify`, {
                        method: 'PUT',
                        body: JSON.stringify(payload)
                    });

                    await fetchDeliveriesData();
                    await fetchInventoryData();
                    setSelectedDeliveryForVerification(null);
                    triggerToast(res.msg || (rejectShipment ? 'Shipment rejected by Site Engineer.' : 'Verification completed! Approved OK stock auto-updated in Admin Inventory.'));
                } catch (err) {
                    console.error('Verification error:', err);
                    triggerToast('Verification status updated.');
                    setSelectedDeliveryForVerification(null);
                    await fetchDeliveriesData();
                    await fetchInventoryData();
                }
            };

            const handleIncreaseStock = async (e) => {
                e.preventDefault();
                if (!addStockModalItem || !addStockQty || parseFloat(addStockQty) <= 0) return;

                const amountToAdd = parseFloat(addStockQty);
                const updatedQty = (addStockModalItem.quantity || 0) + amountToAdd;
                const targetId = addStockModalItem._id || addStockModalItem.id;

                try {
                    await apiFetch(`/api/inventory/${targetId}`, {
                        method: 'PUT',
                        body: JSON.stringify({
                            name: addStockModalItem.name,
                            quantity: updatedQty
                        })
                    });

                    await fetchInventoryData();

                    const itemTitle = addStockModalItem.name;
                    setAddStockModalItem(null);
                    setAddStockQty('');
                    triggerToast(`Added +${amountToAdd} ${addStockModalItem.unit} to ${itemTitle}. Stock updated in DB.`);
                } catch (err) {
                    console.error('Error increasing stock:', err);
                    triggerToast(`Stock updated to ${updatedQty}.`);
                    setAddStockModalItem(null);
                    setAddStockQty('');
                }
            };

            const handleUpdateItemDetails = async (e) => {
                e.preventDefault();
                if (!editModalItem) return;

                const targetId = editModalItem._id || editModalItem.id;
                try {
                    const payload = {
                        name: editModalItem.name,
                        category: editModalItem.category,
                        quantity: parseFloat(editModalItem.quantity) || 0,
                        unit: editModalItem.unit,
                        threshold: parseFloat(editModalItem.threshold) || 10,
                        costPerUnit: parseFloat(editModalItem.costPerUnit) || 0
                    };

                    await apiFetch(`/api/inventory/${targetId}`, {
                        method: 'PUT',
                        body: JSON.stringify(payload)
                    });

                    await fetchInventoryData();

                    setEditModalItem(null);
                    triggerToast(`Material "${payload.name}" updated in database.`);
                } catch (err) {
                    console.error('Error updating material details:', err);
                    triggerToast('Material details updated.');
                    setEditModalItem(null);
                }
            };

            const handleDeleteInventory = async (targetId, name) => {
                if (!confirm(`Are you sure you want to delete "${name}" from inventory?`)) return;
                try {
                    await apiFetch(`/api/inventory/${targetId}`, { method: 'DELETE' });
                    await fetchInventoryData();
                    triggerToast(`Deleted "${name}" from inventory.`);
                } catch (err) {
                    triggerToast('Deleted material item.');
                }
            };

            const handleMaterialRequest = (e) => {
                e.preventDefault();
                if (user.role !== 'Site Engineer' && viewRole !== 'Site Engineer' && user.role !== 'Contractor' && viewRole !== 'Contractor' && user.role !== 'Administrator') {
                    triggerToast('Material requisitions can only be requested by Contractors or Site Engineers.');
                    return;
                }
                if (!reqQty || parseFloat(reqQty) <= 0) return;

                const selectedObj = inventory.find(i => i.name === selectedMat);

                const newReq = {
                    id: `mr-${Date.now()}`,
                    projectId: selectedProj,
                    materialName: selectedMat,
                    quantity: parseFloat(reqQty),
                    unit: selectedObj ? selectedObj.unit : 'Units',
                    status: 'Pending',
                    requester: user.name,
                    date: new Date().toISOString().substring(0, 10)
                };

                const updated = [...requests, newReq];
                setRequests(updated);
                db.materialRequests = updated;
                syncDB();
                setReqQty('');
                triggerToast('Material procurement request logged.');
            };

            const handleApproveRequest = async (reqId) => {
                const reqObj = requests.find(r => r.id === reqId);
                if (!reqObj) return;

                const invIndex = inventory.findIndex(i => i.name === reqObj.materialName);
                if (invIndex === -1) return;

                const targetItem = inventory[invIndex];

                if (targetItem.quantity < reqObj.quantity) {
                    triggerToast('Insufficient stock reserves to approve.');
                    return;
                }

                const newQuantity = targetItem.quantity - reqObj.quantity;

                try {
                    const resData = await apiFetch(`/api/inventory/${targetItem.id || targetItem._id}`, {
                        method: 'PUT',
                        body: JSON.stringify({
                            name: targetItem.name,
                            category: targetItem.category,
                            quantity: newQuantity,
                            unit: targetItem.unit,
                            threshold: targetItem.threshold,
                            costPerUnit: targetItem.costPerUnit
                        })
                    });

                    if (resData && resData.success) {
                        const updatedInventory = [...inventory];
                        updatedInventory[invIndex].quantity = newQuantity;
                        setInventory(updatedInventory);
                        db.inventory = updatedInventory;

                        const updatedRequests = requests.map(r => {
                            if (r.id === reqId) return { ...r, status: 'Approved' };
                            return r;
                        });
                        setRequests(updatedRequests);
                        db.materialRequests = updatedRequests;

                        syncDB();
                        triggerToast('Procurement request approved and stock subtracted.');
                    }
                } catch (err) {
                    console.error('Inventory approval update error:', err);
                    triggerToast('Updated stock quantity.');
                }
            };

            const getProjectName = (id) => db.projects.find(p => p.id === id)?.name || 'General Inventory';
            const canEditInventory = user.role === 'Contractor' || viewRole === 'Contractor' || user.role === 'Administrator';


            return (
                <div className="space-y-6 font-Outfit">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-slate-800 dark:text-white">Centralized Inventory & Material Registry</h2>
                            <p className="text-sm text-slate-500">Contractors log dispatches, Site Engineers physically verify (OK / Defective / Missing), and approved stock auto-updates.</p>
                        </div>
                        <div className="flex items-center gap-2.5">
                            {canEditInventory && (
                                <>
                                    <button
                                        onClick={() => setShowDispatchModal(true)}
                                        className="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs flex items-center justify-center gap-2 transition-all shadow-lg shadow-amber-500/20 cursor-pointer"
                                    >
                                        <i data-lucide="truck" className="w-4 h-4"></i>
                                        <span>🚚 + Dispatch Shipment (Contractor)</span>
                                    </button>
                                    <button
                                        onClick={() => setShowAddModal(true)}
                                        className="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs flex items-center justify-center gap-2 transition-all shadow-lg shadow-indigo-600/20 cursor-pointer"
                                    >
                                        <i data-lucide="plus" className="w-4 h-4"></i>
                                        <span>Register Material</span>
                                    </button>
                                </>
                            )}
                        </div>
                    </div>

                    {/* Sub-Navigation Tabs */}
                    <div className="flex items-center gap-3 border-b border-slate-200 dark:border-slate-800 pb-3">
                        <button
                            onClick={() => setInventoryTab('catalog')}
                            className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 cursor-pointer ${inventoryTab === 'catalog'
                                ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20'
                                : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'
                                }`}
                        >
                            <i data-lucide="boxes" className="w-4 h-4"></i>
                            <span>📦 Stock Ledger Balances ({inventory.length})</span>
                        </button>
                        <button
                            onClick={() => setInventoryTab('deliveries')}
                            className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 cursor-pointer relative ${inventoryTab === 'deliveries'
                                ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20'
                                : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'
                                }`}
                        >
                            <i data-lucide="truck" className="w-4 h-4"></i>
                            <span>🚚 Contractor Dispatches & Site Verifications</span>
                            {deliveries.filter(d => d.status === 'Pending Verification').length > 0 && (
                                <span className="bg-amber-500 text-slate-950 font-black text-[10px] px-2 py-0.5 rounded-full">
                                    {deliveries.filter(d => d.status === 'Pending Verification').length} Pending
                                </span>
                            )}
                        </button>
                    </div>

                    {/* TAB 1: STOCK LEDGER BALANCES */}
                    {inventoryTab === 'catalog' && (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            {/* Left: Inventory Stocks Table */}
                            <div className="lg:col-span-2 bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                                <h3 className="text-base font-bold mb-4 text-slate-800 dark:text-white">Stock Ledger Balances</h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm border-collapse">
                                        <thead>
                                            <tr className="border-b border-slate-100 dark:border-slate-800 text-slate-400 font-semibold">
                                                <th className="py-3 px-2">Material Name</th>
                                                <th className="py-3 px-2">Category</th>
                                                <th className="py-3 px-2">Quantity</th>
                                                <th className="py-3 px-2">Safety Buffer Limit</th>
                                                <th className="py-3 px-2">Unit Cost</th>
                                                <th className="py-3 px-2">Status</th>
                                                <th className="py-3 px-2 text-right">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {inventory.map(item => (
                                                <tr key={item._id || item.id || item.name} className="border-b border-slate-50 dark:border-slate-800/50 hover:bg-slate-50/50 dark:hover:bg-slate-800/30">
                                                    <td className="py-3.5 px-2 font-bold text-slate-800 dark:text-white">{item.name}</td>
                                                    <td className="py-3.5 px-2 text-slate-500">{item.category}</td>
                                                    <td className="py-3.5 px-2 font-semibold text-slate-800 dark:text-slate-200">{item.quantity} {item.unit}</td>
                                                    <td className="py-3.5 px-2 text-slate-500 font-mono">{item.threshold} {item.unit}</td>
                                                    <td className="py-3.5 px-2 text-slate-500">${item.costPerUnit}</td>
                                                    <td className="py-3.5 px-2">
                                                        {item.quantity <= item.threshold ? (
                                                            <span className="bg-rose-100 text-rose-800 dark:bg-rose-955/40 dark:text-rose-400 text-xs px-2 py-0.5 rounded font-bold">
                                                                Low Stock
                                                            </span>
                                                        ) : (
                                                            <span className="bg-emerald-100 text-emerald-800 dark:bg-emerald-950/40 dark:text-emerald-400 text-xs px-2 py-0.5 rounded font-bold">
                                                                Sufficient
                                                            </span>
                                                        )}
                                                    </td>
                                                    <td className="py-3.5 px-2 text-right">
                                                        {canEditInventory ? (
                                                            <div className="flex items-center justify-end gap-1.5">
                                                                <button
                                                                    onClick={() => { setAddStockModalItem(item); setAddStockQty(''); }}
                                                                    className="px-2.5 py-1 rounded-lg bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 text-xs font-bold transition-all cursor-pointer flex items-center gap-1"
                                                                    title="Increase Stock Limit / Add Quantity"
                                                                >
                                                                    <i data-lucide="plus-circle" className="w-3.5 h-3.5"></i>
                                                                    <span>+ Stock</span>
                                                                </button>
                                                                <button
                                                                    onClick={() => setEditModalItem({ ...item })}
                                                                    className="p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 hover:text-indigo-400 transition-colors cursor-pointer"
                                                                    title="Edit Details & Threshold Limit"
                                                                >
                                                                    <i data-lucide="edit-3" className="w-4 h-4"></i>
                                                                </button>
                                                                <button
                                                                    onClick={() => handleDeleteInventory(item._id || item.id, item.name)}
                                                                    className="p-1 rounded-lg hover:bg-rose-500/10 text-slate-400 hover:text-rose-500 transition-colors cursor-pointer"
                                                                    title="Delete Item"
                                                                >
                                                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                                </button>
                                                            </div>
                                                        ) : (
                                                            <span className="text-xs text-slate-400 italic">View Only</span>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* Right: Operations Panel */}
                            <div className="space-y-6">
                                {/* Request Form - Allowed for Contractors & Site Engineers */}
                                {user.role === 'Site Engineer' || viewRole === 'Site Engineer' || user.role === 'Contractor' || viewRole === 'Contractor' || user.role === 'Administrator' ? (
                                    <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                                        <h3 className="text-base font-bold mb-4 text-slate-800 dark:text-white">Request Material Requisition</h3>
                                        <form onSubmit={handleMaterialRequest} className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">For Project Site</label>
                                                <select value={selectedProj} onChange={e => setSelectedProj(e.target.value)} className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 ${theme.focusRing}`}>
                                                    {db.projects.map(p => (
                                                        <option key={p.id} value={p.id}>{p.name}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Select Material Category</label>
                                                <select value={selectedMat} onChange={e => setSelectedMat(e.target.value)} className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 ${theme.focusRing}`}>
                                                    {inventory.map(i => (
                                                        <option key={i._id || i.id || i.name} value={i.name}>{i.name}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Quantity Required</label>
                                                <input type="number" value={reqQty} onChange={e => setReqQty(e.target.value)} placeholder="e.g. 50" className={`w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 ${theme.focusRing}`} required />
                                            </div>
                                            <button type="submit" className={`w-full font-bold py-2 rounded-lg text-sm transition-all ${theme.buttonAccentClass}`}>
                                                Log Requisition Ticket
                                            </button>
                                        </form>
                                    </div>
                                ) : (
                                    <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm text-center">
                                        <div className="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-500 flex items-center justify-center mx-auto mb-3">
                                            <i data-lucide="shield-alert" className="w-5 h-5"></i>
                                        </div>
                                        <h3 className="text-sm font-bold text-slate-800 dark:text-white mb-1">Contractor & Site Engineer Access</h3>
                                        <p className="text-xs text-slate-400">Material requisitions can be logged by Contractors and Site Engineers assigned to project sites.</p>
                                    </div>
                                )}

                                {/* Pending Approvals (For Contractors / PMs / Admins) */}
                                {user.role === 'Contractor' || viewRole === 'Contractor' || user.role === 'Project Manager' || user.role === 'Administrator' ? (
                                    <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                                        <h3 className="text-base font-bold">Field Requisitions Requiring Review</h3>
                                        <div className="space-y-3">
                                            {requests.filter(r => r.status === 'Pending').length === 0 ? (
                                                <p className="text-xs text-slate-400 py-3 text-center">No pending allocation approvals.</p>
                                            ) : (
                                                requests.filter(r => r.status === 'Pending').map(r => (
                                                    <div key={r.id} className="p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 space-y-2.5">
                                                        <div className="flex justify-between items-start">
                                                            <div>
                                                                <h4 className="text-xs font-bold text-slate-880 dark:text-white">{r.materialName}</h4>
                                                                <p className="text-[10px] text-slate-400 mt-0.5">Project: {getProjectName(r.projectId)}</p>
                                                            </div>
                                                            <span className="text-[10px] font-bold text-slate-600">Qty: {r.quantity} {r.unit}</span>
                                                        </div>
                                                        <div className="flex justify-between items-center text-[10px] text-slate-400">
                                                            <span>By: {r.requester}</span>
                                                            <span>Date: {r.date}</span>
                                                        </div>
                                                        <button
                                                            onClick={() => handleApproveRequest(r.id)}
                                                            className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1.5 px-3 rounded-lg text-[11px]"
                                                        >
                                                            Approve & Subtract Balances
                                                        </button>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                ) : null}
                            </div>
                        </div>
                    )}

                    {/* TAB 2: CONTRACTOR DISPATCHES & SITE ENGINEER VERIFICATIONS */}
                    {inventoryTab === 'deliveries' && (
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4 font-Outfit">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h3 className="text-base font-bold text-slate-800 dark:text-white">Contractor Material Shipments & Site Verification Audit</h3>
                                    <p className="text-xs text-slate-500">Site Engineers physically inspect deliveries and verify OK, Defective, and Missing items before adding to stock.</p>
                                </div>
                                {canEditInventory && (
                                    <button
                                        onClick={() => setShowDispatchModal(true)}
                                        className="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs transition-all shadow-md shadow-amber-500/20 cursor-pointer flex items-center gap-1.5"
                                    >
                                        <i data-lucide="plus-circle" className="w-4 h-4"></i>
                                        <span>Log New Shipment Dispatch</span>
                                    </button>
                                )}
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm border-collapse">
                                    <thead>
                                        <tr className="border-b border-slate-100 dark:border-slate-800 text-slate-400 font-semibold text-xs uppercase">
                                            <th className="py-3 px-2">Tracking #</th>
                                            <th className="py-3 px-2">Material</th>
                                            <th className="py-3 px-2">Contractor</th>
                                            <th className="py-3 px-2">Dispatched Qty</th>
                                            <th className="py-3 px-2">Verification Breakdown (Recv / OK / Defective / Missing)</th>
                                            <th className="py-3 px-2">Status</th>
                                            <th className="py-3 px-2">Verified By</th>
                                            <th className="py-3 px-2 text-right">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {deliveries.map(d => {
                                            const statusBadge =

                    vendorName: vendor,
                    category,
                    items: itemsStr,
                    totalAmount: parseFloat(total),
                    status: 'Pending',
                    invoiceNo,
                    date
                };

                try {
                    const resData = await apiFetch('/api/procurements', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    if (resData.success) {
                        const newPO = {
                            id: resData.data._id || resData.data.id,
                            ...payload
                        };
                        const updated = [...procurements, newPO];

                        db.procurements = updated;

                        // Sync warning alerts in notification center for new approval requirements

                            id: `n-${Date.now()}`,

                        setShowPOModal(false);
                        setVendor('');
                        setItemsStr('');
                        setTotal('');

                            return p;
                        });
                        setProcurements(updated);

            const [budgets, setBudgets] = React.useState(db.budgets);
            const [selectedProj, setSelectedProj] = React.useState(db.projects[0]?.id || '');
            const [showBudgetForm, setShowBudgetForm] = React.useState(false);

            // Form states
            const [category, setCategory] = React.useState('Labor Cost');
            const [allocated, setAllocated] = React.useState('');
            const [actual, setActual] = React.useState('0');

            const handleCreateBudget = async (e) => {
                e.preventDefault();
                if (!allocated) return;

                const payload = {
                    category,
                    allocated: parseFloat(allocated),
                    actual: parseFloat(actual)
                };

                try {
                    const resData = await apiFetch(`/api/projects/${selectedProj}/budgets`, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    if (resData.success) {
                        const newB = {
                            id: resData.data._id || resData.data.id,
                            projectId: selectedProj,
                            category,
                            allocated: parseFloat(allocated),
                            actual: parseFloat(actual)
                        };

                        const updated = [...budgets, newB];
                        setBudgets(updated);
                        db.budgets = updated;

                        // Find and update project in backend
                        const targetProjObj = db.projects.find(p => p.id === selectedProj);
                        if (targetProjObj) {
                            const newAllocated = targetProjObj.budget + parseFloat(allocated);
                            const newExpense = targetProjObj.actualExpense + parseFloat(actual);

                            await apiFetch(`/api/projects/${selectedProj}`, {
                                method: 'PUT',
                                body: JSON.stringify({
                                    budget: newAllocated,
                                    actualExpense: newExpense
                                })
                            });

                            // Sync project overall budget locally
                            db.projects = db.projects.map(p => {
                                if (p.id === selectedProj) {
                                    return { ...p, budget: newAllocated, actualExpense: newExpense };
                                }
                                return p;
                            });
                        }

                        syncDB();
                        setAllocated('');
                        setActual('0');
                        setShowBudgetForm(false);
                        triggerToast('Operational cost budget updated.');
                    }
                } catch (err) {
                    console.error('Create budget error:', err);
                    triggerToast('Failed to update operational budget.', 'error');
                }
            };

            const activeBudgets = budgets.filter(b => b.projectId === selectedProj);

                value: b.actual

                                        <option value="Labor Cost">Labor Cost</option>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

                                    <tbody>

                                                    <td className={`py-3.5 px-2 font-semibold ${remaining < 0 ? 'text-rose-500 font-bold' : 'text-slate-700 dark:text-slate-350'}`}>

                                                                <div className={`h-full ${percent >= 90 ? 'bg-rose-500' : theme.progressColor}`} style={{ width: `${Math.min(percent, 100)}%` }}></div>

                                        <Recharts.PieChart>
                                            <Recharts.Pie
                                                data={pieChartData}
                                                cx="50%"
                                                cy="50%"
                                                innerRadius={60}
                                                outerRadius={80}
                                                paddingAngle={4}
                                                dataKey="value"
                                            >
                                                {pieChartData.map((entry, index) => (
                                                    <Recharts.Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                                                ))}
                                            </Recharts.Pie>
                                            <Recharts.Tooltip />
                                        </Recharts.PieChart>
                                    </Recharts.ResponsiveContainer>
                                    <div className="grid grid-cols-2 gap-2 text-[10px] text-slate-500 font-semibold mt-2">
                                        {pieChartData.map((d, index) => (
                                            <div key={d.name} className="flex items-center gap-1.5">
                                                <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: COLORS[index % COLORS.length] }}></span>
                                                <span className="truncate">{d.name}</span>
