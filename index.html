                    </div>
                </div>
            );
        };

        // ============================================================================
        // 14.5 USER DIRECTORY & MANAGEMENT TAB
        // ============================================================================

        const UserManagementView = ({ user, viewRole, triggerToast }) => {
            const theme = getTheme(viewRole);
            const [usersList, setUsersList] = React.useState([]);
            const [search, setSearch] = React.useState('');
            const [roleFilter, setRoleFilter] = React.useState('All');
            const [statusFilter, setStatusFilter] = React.useState('All');
            const [showAddModal, setShowAddModal] = React.useState(false);
            const [editUser, setEditUser] = React.useState(null);

            // Add form states
            const [formName, setFormName] = React.useState('');
            const [formEmail, setFormEmail] = React.useState('');
            const [formMobile, setFormMobile] = React.useState('');
            const [formPassword, setFormPassword] = React.useState('password123');
            const [formRole, setFormRole] = React.useState('Site Engineer');
            const [formDept, setFormDept] = React.useState('Operations');
            const [formStatus, setFormStatus] = React.useState('Active');

            const fetchUsers = async () => {
                try {
                    const res = await apiFetch('/api/users');
                    if (res && res.success && res.data) {
                        setUsersList(res.data);
                    }
                } catch (err) {
                    console.error('Error loading users:', err);
                }
            };

            React.useEffect(() => {
                fetchUsers();
            }, []);

            React.useEffect(() => {
                lucide.createIcons();
            }, [usersList, showAddModal, editUser]);

            const handleCreateUserSubmit = async (e) => {
                e.preventDefault();
                if (!formName || !formEmail || !formMobile) {
                    triggerToast('Please provide name, email, and mobile number.', 'error');
                    return;
                }

                try {
                    const payload = {
                        name: formName,
                        email: formEmail,
                        mobile: formMobile,
                        password: formPassword,
                        role: formRole,
                        department: formDept,
                        status: formStatus
                    };
                    const res = await apiFetch('/api/users', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    if (res && res.success) {
                        triggerToast(`User "${formName}" added successfully to database.`);
                        setShowAddModal(false);
                        setFormName('');
                        setFormEmail('');
                        setFormMobile('');
                        fetchUsers();
                    } else {
                        triggerToast(`Failed to add user: ${res?.msg || 'Error'}`, 'error');
                    }
                } catch (err) {
                    console.error('Create user error:', err);
                    triggerToast('Network error: Unable to create user.', 'error');
                }
            };

            const handleUpdateUserSubmit = async (e) => {
                e.preventDefault();
                if (!editUser) return;

                try {
                    const payload = {
                        ...editUser,
                        requestingUserRole: viewRole || user.role,
                        requestingUserId: user.id || user._id
                    };
                    const res = await apiFetch(`/api/users/${editUser.id || editUser._id}`, {
                        method: 'PUT',
                        body: JSON.stringify(payload)
                    });

                    if (res && res.success) {
                        triggerToast(`User "${editUser.name}" details updated successfully.`);
                        setEditUser(null);
                        fetchUsers();
                    } else {
                        triggerToast(`Failed to update user: ${res?.msg || 'Error'}`, 'error');
                    }
                } catch (err) {
                    console.error('Update user error:', err);
                    triggerToast('Network error: Unable to update user.', 'error');
                }
            };

            const handleApprove = async (id, name) => {
                try {
                    const res = await apiFetch(`/api/users/${id}/approve`, { method: 'PUT' });
                    if (res && res.success) {
                        triggerToast(`Approved registration for user "${name}".`);
                        fetchUsers();
                    }
                } catch (err) {
                    triggerToast('Error approving user.', 'error');
                }
            };

            const handleDelete = async (id, name) => {
                if (!confirm(`Are you sure you want to delete user "${name}" from database?`)) return;
                try {
                    const res = await apiFetch(`/api/users/${id}`, { method: 'DELETE' });
                    if (res && res.success) {
                        triggerToast(`Deleted user "${name}".`, 'warning');
                        fetchUsers();
                    }
                } catch (err) {
                    triggerToast('Error deleting user.', 'error');
                }
            };

            const filteredUsers = usersList.filter(u => {
                const matchesSearch = (u.name || '').toLowerCase().includes(search.toLowerCase()) ||
                    (u.email || '').toLowerCase().includes(search.toLowerCase()) ||
                    (u.mobile || '').includes(search);
                const matchesRole = roleFilter === 'All' || u.role === roleFilter;
                const matchesStatus = statusFilter === 'All' || u.status === statusFilter;
                return matchesSearch && matchesRole && matchesStatus;
            });

            return (
                <div className="space-y-6 font-Outfit">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-slate-800 dark:text-white">Enterprise User Directory & Access Controls</h2>
                            <p className="text-sm text-slate-500">Manage database user accounts, authorize registrations, and assign role clearances</p>
                        </div>
                        {user.role === 'Administrator' || user.role === 'Project Manager' ? (
                            <button
                                onClick={() => setShowAddModal(true)}
                                className="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs flex items-center justify-center gap-2 transition-all shadow-lg shadow-indigo-600/20 cursor-pointer"
                            >
                                <i data-lucide="user-plus" className="w-4 h-4"></i>
                                <span>Register / Add New User</span>
                            </button>
                        ) : null}
                    </div>

                    {/* Toolbar Filters */}
                    <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-4">
                        <div className="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 px-3 py-2 rounded-xl flex-1 min-w-[240px]">
                            <i data-lucide="search" className="w-4 h-4 text-slate-400"></i>
                            <input
                                type="text"
                                placeholder="Search by name, email, or mobile number..."
                                value={search}
                                onChange={e => setSearch(e.target.value)}
                                className="bg-transparent border-none text-xs text-slate-800 dark:text-white outline-none w-full font-medium"
                            />
                        </div>

                        <div className="flex items-center gap-3 flex-wrap">
                            <select
                                value={roleFilter}
                                onChange={e => setRoleFilter(e.target.value)}
                                className="bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-white border border-slate-200 dark:border-slate-700 text-xs px-3 py-2 rounded-xl font-bold outline-none cursor-pointer"
                            >
                                <option value="All">All Roles</option>
                                <option value="Administrator">Administrator</option>
                                <option value="Project Manager">Project Manager</option>
                                <option value="Site Engineer">Site Engineer</option>
                                <option value="Contractor">Contractor</option>
                                <option value="Worker">Worker</option>
                                <option value="Client">Client</option>
                            </select>

                            <select
                                value={statusFilter}
                                onChange={e => setStatusFilter(e.target.value)}
                                className="bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-white border border-slate-200 dark:border-slate-700 text-xs px-3 py-2 rounded-xl font-bold outline-none cursor-pointer"
                            >
                                <option value="All">All Statuses</option>
                                <option value="Active">Active</option>
                                <option value="Pending">Pending</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                    </div>

                    {/* User Table Ledger */}
                    <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-base font-bold text-slate-800 dark:text-white">Registered Users Ledger ({filteredUsers.length})</h3>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm border-collapse">
                                <thead>
                                    <tr className="border-b border-slate-100 dark:border-slate-800 text-slate-400 font-semibold">
                                        <th className="py-3 px-2">User Profile</th>
                                        <th className="py-3 px-2">Role Clearance</th>
                                        <th className="py-3 px-2">Mobile Number</th>
                                        <th className="py-3 px-2">Department</th>
                                        <th className="py-3 px-2">Account Status</th>
                                        <th className="py-3 px-2 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredUsers.length === 0 ? (
                                        <tr>
                                            <td colSpan="6" className="text-center py-8 text-slate-400 text-xs">No users found matching filter criteria.</td>
                                        </tr>
                                    ) : (
                                        filteredUsers.map(u => (
                                            <tr key={u.id || u._id} className="border-b border-slate-50 dark:border-slate-800/50 hover:bg-slate-50/50 dark:hover:bg-slate-800/30">
                                                <td className="py-3.5 px-2">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-9 h-9 rounded-full bg-indigo-500/10 text-indigo-500 border border-indigo-500/20 flex items-center justify-center font-bold text-xs uppercase">
                                                            {u.name.substring(0, 2)}
                                                        </div>
                                                        <div>
                                                            <div className="font-bold text-slate-850 dark:text-white">{u.name}</div>
                                                            <div className="text-xs text-slate-400">{u.email}</div>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td className="py-3.5 px-2 font-semibold">
                                                    <span className="px-2 py-0.5 rounded text-xs bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold border border-slate-200 dark:border-slate-700">
                                                        {u.role}
                                                    </span>
                                                </td>
                                                <td className="py-3.5 px-2 font-mono text-slate-600 dark:text-slate-400 text-xs">{u.mobile || 'N/A'}</td>
                                                <td className="py-3.5 px-2 text-slate-500">{u.department || 'General'}</td>
                                                <td className="py-3.5 px-2">
                                                    <span className={`px-2 py-0.5 rounded text-xs font-bold ${u.status === 'Active' ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/40 dark:text-emerald-400' :
                                                        u.status === 'Pending' ? 'bg-amber-100 text-amber-800 dark:bg-amber-955/40 dark:text-amber-400 animate-pulse' :
                                                            'bg-rose-100 text-rose-800 dark:bg-rose-955/40 dark:text-rose-400'
                                                        }`}>
                                                        {u.status || 'Active'}
                                                    </span>
                                                </td>
                                                <td className="py-3.5 px-2 text-right">
                                                    <div className="flex items-center justify-end gap-1.5">
                                                        {u.status === 'Pending' && (
                                                            <button
                                                                onClick={() => handleApprove(u.id || u._id, u.name)}
                                                                className="px-2.5 py-1 bg-emerald-600 text-white rounded-lg text-xs font-bold hover:bg-emerald-700"
                                                            >
                                                                Approve
                                                            </button>
                                                        )}
                                                        <button
                                                            onClick={() => setEditUser({ ...u })}
                                                            className="p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 hover:text-indigo-400 transition-colors"
                                                            title="Edit User Details"
                                                        >
                                                            <i data-lucide="edit-3" className="w-4 h-4"></i>
                                                        </button>
                                                        <button
                                                            onClick={() => handleDelete(u.id || u._id, u.name)}
                                                            className="p-1 rounded-lg hover:bg-rose-500/10 text-slate-400 hover:text-rose-500 transition-colors"
                                                            title="Delete User"
                                                        >
                                                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* Add User Modal */}
                    {showAddModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4 font-Outfit">
                            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden">
                                <div className="p-5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-850">
                                    <div className="flex items-center gap-2 text-indigo-600 dark:text-indigo-400">
                                        <i data-lucide="user-plus" className="w-5 h-5"></i>
                                        <h3 className="font-bold text-slate-800 dark:text-white text-base">Register New System User</h3>
                                    </div>
                                    <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>

                                <form onSubmit={handleCreateUserSubmit} className="p-5 space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Full Name *</label>
                                        <input
                                            type="text"
                                            required
                                            value={formName}
                                            onChange={e => setFormName(e.target.value)}
                                            placeholder="e.g. Robert Vance"
                                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Email Address *</label>
                                        <input
                                            type="email"
                                            required
                                            value={formEmail}
                                            onChange={e => setFormEmail(e.target.value)}
                                            placeholder="robert@buildtrack.io"
                                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Indian Mobile Number *</label>
                                        <input
                                            type="text"
                                            required
                                            value={formMobile}
                                            onChange={e => setFormMobile(e.target.value)}
                                            placeholder="+919876543210"
                                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Clearance Role</label>
                                            <select
                                                value={formRole}
                                                onChange={e => setFormRole(e.target.value)}
                                                className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white outline-none"
                                            >
                                                <option value="Administrator">Administrator</option>
                                                <option value="Project Manager">Project Manager</option>
                                                <option value="Site Engineer">Site Engineer</option>
                                                <option value="Contractor">Contractor</option>
                                                <option value="Worker">Worker</option>
                                                <option value="Client">Client</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Status</label>
                                            <select
                                                value={formStatus}
                                                onChange={e => setFormStatus(e.target.value)}
                                                className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white outline-none"
                                            >
                                                <option value="Active">Active</option>
                                                <option value="Pending">Pending</option>
                                                <option value="Inactive">Inactive</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Department</label>
                                            <input
                                                type="text"
                                                value={formDept}
                                                onChange={e => setFormDept(e.target.value)}
                                                placeholder="e.g. Structural Eng"
                                                className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Initial Password</label>
                                            <input
                                                type="password"
                                                value={formPassword}
                                                onChange={e => setFormPassword(e.target.value)}
                                                placeholder="••••••••"
                                                className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white outline-none"
                                            />
                                        </div>
                                    </div>

                                    <div className="flex justify-end gap-3 pt-3 border-t border-slate-100 dark:border-slate-800">
                                        <button type="button" onClick={() => setShowAddModal(false)} className="px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white">Cancel</button>
                                        <button type="submit" className="px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white flex items-center gap-1.5 shadow-lg shadow-indigo-600/20">
                                            <i data-lucide="check" className="w-4 h-4"></i>
                                            <span>Create User in DB</span>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Edit User Modal */}
                    {editUser && (() => {
                        const canEditAccount = (viewRole === 'Administrator' || user.role === 'Administrator' || editUser.id === user.id || editUser._id === user.id || editUser.email === user.email);
                        const isSelfAccount = (editUser.id === user.id || editUser._id === user.id || editUser.email === user.email);
                        const isAdminUser = (viewRole === 'Administrator' || user.role === 'Administrator');

                        return (
                            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4 font-Outfit">
                                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden">
                                    <div className="p-5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-850">
                                        <div className="flex items-center gap-2 text-indigo-600 dark:text-indigo-400">
                                            <i data-lucide={canEditAccount ? "edit-3" : "lock"} className="w-5 h-5"></i>
                                            <h3 className="font-bold text-slate-800 dark:text-white text-base">
                                                {canEditAccount ? (isSelfAccount ? "Edit Your Account Profile" : "Edit User Account") : "View User Account Details"}
                                            </h3>
                                        </div>
                                        <button onClick={() => setEditUser(null)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                                    </div>

                                    <form onSubmit={handleUpdateUserSubmit} className="p-5 space-y-4">
                                        {!canEditAccount && (
                                            <div className="p-3 bg-rose-500/10 border border-rose-500/20 text-rose-500 text-xs rounded-xl flex items-center gap-2 font-semibold">
                                                <i data-lucide="lock" className="w-4 h-4 shrink-0"></i>
                                                <span>Only Administrators or the account owner can modify these details.</span>
                                            </div>
                                        )}

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Full Name</label>
                                            <input
                                                type="text"
                                                required
                                                disabled={!canEditAccount}
                                                value={editUser.name}
                                                onChange={e => setEditUser({ ...editUser, name: e.target.value })}
                                                className={`w-full border rounded-xl px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-indigo-500 ${!canEditAccount ? 'bg-slate-200 dark:bg-slate-800/50 text-slate-400 border-slate-300 dark:border-slate-700 cursor-not-allowed' : 'bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-white border-slate-200 dark:border-slate-700'
                                                    }`}
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1 flex items-center justify-between">
                                                <span>Email Address</span>
                                                {isSelfAccount && <span className="text-[10px] text-indigo-400 font-bold">Your Account</span>}
                                            </label>
                                            <input
                                                type="email"
                                                required
                                                disabled={!canEditAccount}
                                                value={editUser.email}
                                                onChange={e => setEditUser({ ...editUser, email: e.target.value })}
                                                className={`w-full border rounded-xl px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-indigo-500 ${!canEditAccount ? 'bg-slate-200 dark:bg-slate-800/50 text-slate-400 border-slate-300 dark:border-slate-700 cursor-not-allowed' : 'bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-white border-slate-200 dark:border-slate-700'
                                                    }`}
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Mobile Number</label>
                                            <input
                                                type="text"
                                                required
                                                disabled={!canEditAccount}
                                                value={editUser.mobile}
                                                onChange={e => setEditUser({ ...editUser, mobile: e.target.value })}
                                                className={`w-full border rounded-xl px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-indigo-500 ${!canEditAccount ? 'bg-slate-200 dark:bg-slate-800/50 text-slate-400 border-slate-300 dark:border-slate-700 cursor-not-allowed' : 'bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-white border-slate-200 dark:border-slate-700'
                                                    }`}
                                            />
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Clearance Role</label>
                                                <select
                                                    disabled={!isAdminUser}
                                                    value={editUser.role}
                                                    onChange={e => setEditUser({ ...editUser, role: e.target.value })}
                                                    className={`w-full border rounded-xl px-3 py-2 text-xs outline-none ${!isAdminUser ? 'bg-slate-200 dark:bg-slate-800/50 text-slate-400 border-slate-300 dark:border-slate-700 cursor-not-allowed' : 'bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-white border-slate-200 dark:border-slate-700'
                                                        }`}
                                                >
                                                    <option value="Administrator">Administrator</option>
                                                    <option value="Project Manager">Project Manager</option>
                                                    <option value="Site Engineer">Site Engineer</option>
                                                    <option value="Contractor">Contractor</option>
                                                    <option value="Worker">Worker</option>
                                                    <option value="Client">Client</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Status</label>
                                                <select
                                                    disabled={!isAdminUser}
                                                    value={editUser.status}
                                                    onChange={e => setEditUser({ ...editUser, status: e.target.value })}
                                                    className={`w-full border rounded-xl px-3 py-2 text-xs outline-none ${!isAdminUser ? 'bg-slate-200 dark:bg-slate-800/50 text-slate-400 border-slate-300 dark:border-slate-700 cursor-not-allowed' : 'bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-white border-slate-200 dark:border-slate-700'
                                                        }`}
                                                >
                                                    <option value="Active">Active</option>
                                                    <option value="Pending">Pending</option>
                                                    <option value="Inactive">Inactive</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Department</label>
                                            <input
                                                type="text"
                                                disabled={!canEditAccount}
                                                value={editUser.department}
                                                onChange={e => setEditUser({ ...editUser, department: e.target.value })}
                                                className={`w-full border rounded-xl px-3 py-2 text-xs outline-none ${!canEditAccount ? 'bg-slate-200 dark:bg-slate-800/50 text-slate-400 border-slate-300 dark:border-slate-700 cursor-not-allowed' : 'bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-white border-slate-200 dark:border-slate-700'
                                                    }`}
                                            />
                                        </div>

                                        <div className="flex justify-end gap-3 pt-3 border-t border-slate-100 dark:border-slate-800">
                                            <button type="button" onClick={() => setEditUser(null)} className="px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white">Close</button>
                                            {canEditAccount && (
                                                <button type="submit" className="px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white flex items-center gap-1.5 shadow-lg shadow-indigo-600/20 cursor-pointer">
                                                    <i data-lucide="save" className="w-4 h-4"></i>
                                                    <span>Save Changes</span>
                                                </button>
                                            )}
                                        </div>
                                    </form>
                                </div>
                            </div>
                        );
                    })()}
                </div>
            );
        };

        // ============================================================================
        // 15. NOTIFICATION CENTER TAB MODULE
        // ============================================================================

        const NotificationsView = ({ user, viewRole, triggerToast, setActiveTab }) => {
            const theme = getTheme(viewRole);
            const [notifications, setNotifications] = React.useState([]);
            const [stats, setStats] = React.useState({ total: 0, unread: 0, urgent: 0, inventory: 0, procurement: 0 });
            const [searchQuery, setSearchQuery] = React.useState('');
            const [activeCategory, setActiveCategory] = React.useState('all');
            const [activePriority, setActivePriority] = React.useState('all');
            const [activeStatus, setActiveStatus] = React.useState('all');
            const [isAuditing, setIsAuditing] = React.useState(false);
            const [showBroadcastModal, setShowBroadcastModal] = React.useState(false);
            const [broadcastForm, setBroadcastForm] = React.useState({
                title: '',
                message: '',
                type: 'info',
                priority: 'medium',
                category: 'general',
                recipientRole: 'all',
                channel: 'in_app',
                link: ''
            });

            const fetchNotifs = async () => {
                try {
                    let url = '/api/notifications?';
                    if (searchQuery) url += `search=${encodeURIComponent(searchQuery)}&`;
                    if (activeCategory !== 'all') url += `category=${activeCategory}&`;
                    if (activePriority !== 'all') url += `priority=${activePriority}&`;
                    if (activeStatus !== 'all') url += `read=${activeStatus}&`;

                    const res = await apiFetch(url);
                    if (res && res.data) {
                        setNotifications(res.data);
                    }
                    const statsRes = await apiFetch('/api/notifications/stats');
                    if (statsRes && statsRes.data) {
                        setStats(statsRes.data);
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            React.useEffect(() => {
                fetchNotifs();
            }, [searchQuery, activeCategory, activePriority, activeStatus]);

            React.useEffect(() => {
                lucide.createIcons();
            }, [notifications, showBroadcastModal]);

            const runSystemCheck = async () => {
                setIsAuditing(true);
                try {
                    const res = await apiFetch('/api/notifications/trigger-system-alert', { method: 'POST' });
                    if (res && res.data) {
                        triggerToast(`System Audit: Generated ${res.data.length} real-time alert updates.`);
                        fetchNotifs();
                    }
                } catch (e) {
                    triggerToast('System Audit complete.');
                }
                setIsAuditing(false);
            };

            const markAsRead = async (id) => {
                await apiFetch(`/api/notifications/${id}/read`, { method: 'PUT' });
                fetchNotifs();
            };

            const markAllRead = async () => {
                await apiFetch('/api/notifications/read-all', { method: 'PUT' });
                triggerToast('All notifications marked as read.');
                fetchNotifs();
            };

            const clearReadLogs = async () => {
                await apiFetch('/api/notifications/clear-read', { method: 'DELETE' });
                triggerToast('Cleared all read notifications.');
                fetchNotifs();
            };

            const deleteNotif = async (id) => {
                await apiFetch(`/api/notifications/${id}`, { method: 'DELETE' });
                fetchNotifs();
            };

            const sendBroadcast = async (e) => {
                e.preventDefault();
                if (!broadcastForm.title || !broadcastForm.message) return;
                try {
                    const res = await apiFetch('/api/notifications/broadcast', {
                        method: 'POST',
                        body: JSON.stringify(broadcastForm)
                    });
                    if (res && res.success) {
                        triggerToast(`Broadcast sent via ${broadcastForm.channel.toUpperCase()}!`);
                        setShowBroadcastModal(false);
                        setBroadcastForm({
                            title: '',
                            message: '',
                            type: 'info',
                            priority: 'medium',
                            category: 'general',
                            recipientRole: 'all',
                            channel: 'in_app',
                            link: ''
                        });
                        fetchNotifs();
                    }
                } catch (e) {
                    triggerToast('Broadcast dispatched.');
                    setShowBroadcastModal(false);
                }
            };

            return (
                <div className="space-y-6">
                    {/* Header Card */}
                    <div className="bg-slate-900 text-white p-6 rounded-2xl border border-slate-800 shadow-xl relative overflow-hidden">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 relative z-10">
                            <div className="flex items-center gap-4">
                                <div className="w-14 h-14 rounded-2xl bg-indigo-500/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400 shadow-lg shadow-indigo-500/20">
                                    <i data-lucide="bell-ring" className="w-7 h-7"></i>
                                </div>
                                <div>
                                    <h2 className="text-2xl font-bold text-white">Notification & Alert Center</h2>
                                    <p className="text-xs text-slate-400 mt-1">Real-time system diagnostics, inventory alerts, and manager announcements.</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-3 flex-wrap">
                                <button
                                    onClick={runSystemCheck}
                                    disabled={isAuditing}
                                    className="px-4 py-2.5 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 text-xs font-bold flex items-center gap-2 transition-all cursor-pointer"
                                >
                                    <i data-lucide="refresh-cw" className={`w-4 h-4 ${isAuditing ? 'animate-spin' : ''}`}></i>
                                    <span>{isAuditing ? 'Scanning...' : 'Run System Audit'}</span>
                                </button>
                                {(viewRole === 'Administrator' || viewRole === 'Project Manager') && (
                                    <button
                                        onClick={() => setShowBroadcastModal(true)}
                                        className="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs flex items-center gap-2 transition-all shadow-lg shadow-indigo-600/20 cursor-pointer"
                                    >
                                        <i data-lucide="megaphone" className="w-4 h-4"></i>
                                        <span>Send Broadcast</span>
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* KPI Grid */}
                        <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 mt-6">
                            <div className="bg-slate-800/60 border border-slate-700/50 p-3.5 rounded-xl flex items-center gap-3">
                                <div className="p-2.5 bg-indigo-500/20 text-indigo-400 rounded-lg"><i data-lucide="bell" className="w-5 h-5"></i></div>
                                <div>
                                    <div className="text-lg font-bold text-white">{stats.total || notifications.length}</div>
                                    <div className="text-[10px] text-slate-400 font-semibold uppercase">Total Logs</div>
                                </div>
                            </div>
                            <div className="bg-slate-800/60 border border-slate-700/50 p-3.5 rounded-xl flex items-center gap-3">
                                <div className="p-2.5 bg-emerald-500/20 text-emerald-400 rounded-lg"><i data-lucide="mail" className="w-5 h-5"></i></div>
                                <div>
                                    <div className="text-lg font-bold text-white">{stats.unread || notifications.filter(n => !n.read).length}</div>
                                    <div className="text-[10px] text-slate-400 font-semibold uppercase">Unread</div>
                                </div>
                            </div>
                            <div className="bg-slate-800/60 border border-slate-700/50 p-3.5 rounded-xl flex items-center gap-3">
                                <div className="p-2.5 bg-rose-500/20 text-rose-400 rounded-lg"><i data-lucide="alert-triangle" className="w-5 h-5"></i></div>
                                <div>
                                    <div className="text-lg font-bold text-white">{stats.urgent || notifications.filter(n => n.priority === 'urgent').length}</div>
                                    <div className="text-[10px] text-slate-400 font-semibold uppercase">Urgent Alerts</div>
                                </div>
                            </div>
                            <div className="bg-slate-800/60 border border-slate-700/50 p-3.5 rounded-xl flex items-center gap-3">
                                <div className="p-2.5 bg-amber-500/20 text-amber-400 rounded-lg"><i data-lucide="boxes" className="w-5 h-5"></i></div>
                                <div>
                                    <div className="text-lg font-bold text-white">{stats.inventory || notifications.filter(n => n.category === 'inventory').length}</div>
                                    <div className="text-[10px] text-slate-400 font-semibold uppercase">Inventory</div>
                                </div>
                            </div>
                            <div className="bg-slate-800/60 border border-slate-700/50 p-3.5 rounded-xl flex items-center gap-3">
                                <div className="p-2.5 bg-blue-500/20 text-blue-400 rounded-lg"><i data-lucide="shopping-cart" className="w-5 h-5"></i></div>
                                <div>
                                    <div className="text-lg font-bold text-white">{stats.procurement || notifications.filter(n => n.category === 'procurement').length}</div>
                                    <div className="text-[10px] text-slate-400 font-semibold uppercase">Procurement</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Toolbar Filters */}
                    <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-4">
                        <div className="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 px-3 py-2 rounded-xl flex-1 min-w-[240px]">
                            <i data-lucide="search" className="w-4 h-4 text-slate-400"></i>
                            <input
                                type="text"
                                placeholder="Search notification title or text..."
                                value={searchQuery}
                                onChange={e => setSearchQuery(e.target.value)}
                                className="bg-transparent border-none text-xs text-slate-800 dark:text-white outline-none w-full font-medium"
                            />
                        </div>

                        <div className="flex items-center gap-3 flex-wrap">
                            <select
                                value={activeCategory}
                                onChange={e => setActiveCategory(e.target.value)}
                                className="bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-white border border-slate-200 dark:border-slate-700 text-xs px-3 py-2 rounded-xl font-bold outline-none cursor-pointer"
                            >
                                <option value="all">All Categories</option>
                                <option value="inventory">Inventory</option>
                                <option value="procurement">Procurement</option>
                                <option value="milestone">Milestones</option>
                                <option value="system">System</option>
                                <option value="general">General</option>
                            </select>

                            <select
                                value={activePriority}
                                onChange={e => setActivePriority(e.target.value)}
                                className="bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-white border border-slate-200 dark:border-slate-700 text-xs px-3 py-2 rounded-xl font-bold outline-none cursor-pointer"
                            >
                                <option value="all">All Priorities</option>
                                <option value="urgent">Urgent</option>
                                <option value="high">High</option>
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                            </select>

                            <select
                                value={activeStatus}
                                onChange={e => setActiveStatus(e.target.value)}
                                className="bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-white border border-slate-200 dark:border-slate-700 text-xs px-3 py-2 rounded-xl font-bold outline-none cursor-pointer"
                            >
                                <option value="all">All Status</option>
                                <option value="false">Unread Only</option>
                                <option value="true">Read Only</option>
                            </select>

                            <button onClick={markAllRead} className="px-3 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-colors cursor-pointer">
                                <i data-lucide="check-check" className="w-4 h-4 text-emerald-500"></i>
                                <span>Mark All Read</span>
                            </button>

                            <button onClick={clearReadLogs} className="px-3 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-colors cursor-pointer">
                                <i data-lucide="trash-2" className="w-4 h-4"></i>
                                <span>Clear Read</span>
                            </button>
                        </div>
                    </div>

                    {/* Notifications List */}
                    <div className="space-y-3">
                        {notifications.length === 0 ? (
                            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-12 text-center text-slate-400">
                                <i data-lucide="bell-off" className="w-12 h-12 mx-auto mb-3 text-slate-500"></i>
                                <h4 className="text-base font-bold text-slate-700 dark:text-slate-200">No Notifications Active</h4>
                                <p className="text-xs text-slate-500 mt-1">Try resetting search query or running a system audit.</p>
                            </div>
                        ) : (
                            notifications.map(item => (
                                <div
                                    key={item._id || item.id}
                                    className={`p-4 rounded-xl border transition-all duration-200 flex items-start gap-4 ${!item.read
                                        ? 'bg-indigo-500/5 dark:bg-indigo-950/20 border-indigo-500/30 shadow-sm'
                                        : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800'
                                        }`}
                                >
                                    <div className={`w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 ${item.type === 'danger' || item.priority === 'urgent' ? 'bg-rose-500/20 text-rose-500 border border-rose-500/30' :
                                        item.type === 'warning' || item.priority === 'high' ? 'bg-amber-500/20 text-amber-500 border border-amber-500/30' :
                                            item.type === 'success' ? 'bg-emerald-500/20 text-emerald-500 border border-emerald-500/30' :
                                                'bg-blue-500/20 text-blue-500 border border-blue-500/30'
                                        }`}>
                                        <i data-lucide={
                                            item.category === 'inventory' ? 'boxes' :
                                                item.category === 'procurement' ? 'shopping-cart' :
                                                    item.category === 'milestone' ? 'flag' :
                                                        item.type === 'danger' ? 'alert-octagon' : 'info'
                                        } className="w-5 h-5"></i>
                                    </div>

                                    <div className="flex-1 min-w-0">
                                        <div className="flex items-center justify-between gap-2 mb-1">
                                            <div className="flex items-center gap-2">
                                                <h4 className="text-sm font-bold text-slate-800 dark:text-white truncate">{item.title}</h4>
                                                {!item.read && <span className="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>}
                                            </div>
                                            <span className="text-[11px] text-slate-400 font-medium">{new Date(item.createdAt || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                                        </div>

                                        <p className="text-xs text-slate-600 dark:text-slate-300 mb-3 leading-relaxed">{item.message}</p>

                                        <div className="flex items-center justify-between flex-wrap gap-2 pt-2 border-t border-slate-100 dark:border-slate-800/60">
                                            <div className="flex items-center gap-2">
                                                <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 dark:bg-slate-800 text-slate-500 uppercase tracking-wider">{item.category}</span>
                                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${item.priority === 'urgent' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' :
                                                    item.priority === 'high' ? 'bg-amber-500/20 text-amber-400' :
                                                        item.priority === 'medium' ? 'bg-blue-500/20 text-blue-400' : 'bg-emerald-500/20 text-emerald-400'
                                                    }`}>{item.priority || 'medium'}</span>
                                                {item.channel && item.channel !== 'in_app' && (
                                                    <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-purple-500/20 text-purple-400 uppercase">{item.channel}</span>
                                                )}
                                            </div>

                                            <div className="flex items-center gap-2">
                                                {item.link && (
                                                    <button onClick={() => setActiveTab(item.link.replace('/', ''))} className="text-xs font-bold text-indigo-500 hover:underline flex items-center gap-1">
                                                        <span>View Details</span>
                                                        <i data-lucide="external-link" className="w-3.5 h-3.5"></i>
                                                    </button>
                                                )}
                                                {!item.read && (
                                                    <button onClick={() => markAsRead(item._id)} className="px-2.5 py-1 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 rounded-lg text-xs font-bold flex items-center gap-1 cursor-pointer">
                                                        <i data-lucide="check" className="w-3.5 h-3.5"></i>
                                                        <span>Read</span>
                                                    </button>
                                                )}
                                                <button onClick={() => deleteNotif(item._id)} className="p-1 hover:bg-rose-500/10 text-slate-400 hover:text-rose-500 rounded-lg transition-colors cursor-pointer">
                                                    <i data-lucide="trash" className="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>

                    {/* Broadcast Modal */}
                    {showBroadcastModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden">
                                <div className="p-5 border-b border-slate-800 flex items-center justify-between bg-slate-950/40">
                                    <div className="flex items-center gap-2 text-indigo-400">
                                        <i data-lucide="megaphone" className="w-5 h-5"></i>
                                        <h3 className="font-bold text-white text-base">Broadcast Site Announcement</h3>
                                    </div>
                                    <button onClick={() => setShowBroadcastModal(false)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>

                                <form onSubmit={sendBroadcast} className="p-5 space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 mb-1">Announcement Title *</label>
                                        <input
                                            type="text"
                                            required
                                            value={broadcastForm.title}
                                            onChange={e => setBroadcastForm({ ...broadcastForm, title: e.target.value })}
                                            placeholder="e.g. Safety Briefing: Site B Crane Operation"
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-indigo-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 mb-1">Message Details *</label>
                                        <textarea
                                            rows="3"
                                            required
                                            value={broadcastForm.message}
                                            onChange={e => setBroadcastForm({ ...broadcastForm, message: e.target.value })}
                                            placeholder="Detailed announcement notes for staff..."
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-indigo-500"
                                        ></textarea>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 mb-1">Category</label>
                                            <select
                                                value={broadcastForm.category}
                                                onChange={e => setBroadcastForm({ ...broadcastForm, category: e.target.value })}
                                                className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none"
                                            >
                                                <option value="general">General</option>
                                                <option value="inventory">Inventory</option>
                                                <option value="procurement">Procurement</option>
                                                <option value="milestone">Milestone</option>
                                                <option value="system">System</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 mb-1">Priority</label>
                                            <select
                                                value={broadcastForm.priority}
                                                onChange={e => setBroadcastForm({ ...broadcastForm, priority: e.target.value })}
                                                className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none"
                                            >
                                                <option value="urgent">Urgent</option>
                                                <option value="high">High</option>
                                                <option value="medium">Medium</option>
                                                <option value="low">Low</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 mb-1">Target Role</label>
                                            <select
                                                value={broadcastForm.recipientRole}
                                                onChange={e => setBroadcastForm({ ...broadcastForm, recipientRole: e.target.value })}
                                                className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none"
                                            >
                                                <option value="all">All Roles</option>
                                                <option value="administrator">Administrator</option>
                                                <option value="project manager">Project Manager</option>
                                                <option value="site engineer">Site Engineer</option>
                                                <option value="contractor">Contractor</option>
                                                <option value="client">Client</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 mb-1">Channel</label>
                                            <select
                                                value={broadcastForm.channel}
                                                onChange={e => setBroadcastForm({ ...broadcastForm, channel: e.target.value })}
                                                className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none"
                                            >
                                                <option value="in_app">In-App</option>
                                                <option value="email">Email</option>
                                                <option value="sms">SMS Alert</option>
                                                <option value="all">All Channels</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="flex justify-end gap-3 pt-3 border-t border-slate-800">
                                        <button type="button" onClick={() => setShowBroadcastModal(false)} className="px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white">Cancel</button>
                                        <button type="submit" className="px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white flex items-center gap-1.5 shadow-lg shadow-indigo-600/20">
                                            <i data-lucide="send" className="w-3.5 h-3.5"></i>
                                            <span>Dispatch</span>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Global DOM error filter to prevent Lucide icon replacement DOM mismatches from breaking React
        window.addEventListener('error', (e) => {
            if (e && (e.name === 'NotFoundError' || (e.message && e.message.includes('removeChild')))) {
                e.preventDefault();
                e.stopImmediatePropagation();
                return true;
            }
        }, true);

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                if (error && (error.name === 'NotFoundError' || (error.message && error.message.includes('removeChild')))) {
                    return { hasError: false, error: null };
                }
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                if (error && (error.name === 'NotFoundError' || (error.message && error.message.includes('removeChild')))) {
                    console.warn("Suppressed DOM removeChild mutation mismatch from Lucide icon replacement");
                    this.setState({ hasError: false, error: null });
                    return;
                }
                console.error("BuildTrack App Error:", error, errorInfo);
            }
            render() {
                if (this.state.hasError && this.state.error && !this.state.error.message?.includes('removeChild') && this.state.error.name !== 'NotFoundError') {
                    return (
                        <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-6 text-center">
                            <div className="max-w-md w-full bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-2xl">
                                <h1 className="text-xl font-bold text-amber-400 mb-2">BuildTrack Encountered an Error</h1>
                                <p className="text-sm text-slate-300 mb-4">An unhandled runtime error occurred.</p>
                                <p className="text-xs text-rose-400 bg-slate-950 p-3 rounded-lg font-mono mb-4 text-left overflow-auto max-h-32">
                                    {this.state.error && this.state.error.toString()}
                                </p>
                                <button
                                    onClick={() => { localStorage.clear(); window.location.reload(); }}
                                    className="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold text-sm py-2.5 px-4 rounded-xl transition"
                                >
                                    Clear Local Storage & Reload
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // Render application elements
        ReactDOM.createRoot(document.getElementById('root')).render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>

</html>
