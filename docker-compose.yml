version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buildtrack-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/buildtrack}
      - JWT_SECRET=${JWT_SECRET:-super_secret_buildtrack_production_jwt_key_2026}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - FAST2SMS_API_KEY=${FAST2SMS_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
    depends_on:
      - mongo
    networks:
      - buildtrack-net

  mongo:
    image: mongo:7.0
    container_name: buildtrack-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - buildtrack-net

volumes:
  mongo-data:
    driver: local

networks:
  buildtrack-net:
    driver: bridge
